<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TENANT_NAME}} Timetable</title>
  <meta name="robots" content="index,follow">
  <!-- Rewritten by applyVisualTheme() to the page colour actually rendered.
       The literal is only what the browser chrome shows before /brand answers. -->
  <meta name="theme-color" content="#F3EFEA">
  <link id="canonicalUrl" rel="canonical" href="/{{TENANT_SLUG}}/timetable">
  <link id="altLangZh" rel="alternate" hreflang="zh-CN" href="/{{TENANT_SLUG}}/timetable">
  <link id="altLangEn" rel="alternate" hreflang="en" href="/{{TENANT_SLUG}}/timetable?lang=en">
  <link id="altLangDefault" rel="alternate" hreflang="x-default" href="/{{TENANT_SLUG}}/timetable">
  <meta id="ogLocale" property="og:locale" content="zh_CN">
  <meta id="ogLocaleAlternate" property="og:locale:alternate" content="en_US">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script src="/assets/ui-common.js?v=__APP_VERSION__"></script>
  <script src="/assets/public-surface.js?v=__APP_VERSION__"></script>
  <script src="/assets/portal-brand.js?v=__APP_VERSION__"></script>
  <script src="/assets/public-analytics.js?v=__APP_VERSION__"></script>
  <link rel="stylesheet" href="/assets/ui-tokens.css?v=__APP_VERSION__">
  <link rel="stylesheet" href="/assets/portal-theme.css?v=__APP_VERSION__">
  <link rel="stylesheet" href="/assets/brand-system.css?v=__APP_VERSION__">
  <style>
    /* No :root here. Every colour on this page comes from portal-theme.css and
       is overridden per tenant by /brand — a fallback hex declared here would
       be a second source for a colour that has one. */
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font-family:var(--font-body); font-weight:400; line-height:1.7; -webkit-font-smoothing:antialiased; }
    /* The navigation is the portal's, class for class. A visitor who taps
       「课程安排」 must not arrive somewhere that looks like a different
       company — this page is one click from the home page and has to belong to
       it. Values copied from tenant-template/index.html rather than
       re-invented, so the two stay recognisably one site. */
    a { color:var(--clay); text-decoration:none; font-weight:500; }
    nav { position:sticky; top:0; left:0; right:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .navrow { display:flex; align-items:center; justify-content:space-between; gap:16px; height:74px; width:min(1180px,100%); margin:0 auto; padding:0 var(--space-phi-md); }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; min-height:var(--tap-min); cursor:pointer; color:var(--ink); }
    .brand img { height:34px; width:auto; display:none; }
    .brand .bn { font-size:16px; letter-spacing:.04em; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .navlinks { display:flex; align-items:center; gap:30px; }
    .navlinks a { font-size:13px; color:var(--ink2); letter-spacing:.02em; position:relative; padding:4px 0; cursor:pointer; max-width:13em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .navlinks a::after { content:""; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--clay); transition:width .3s; }
    .navlinks a:hover::after { width:100%; }
    /* The page you are on is stated, not merely styled — the underline is
       permanent and aria-current says the same thing to a screen reader. */
    .navlinks a[aria-current="page"] { color:var(--ink); }
    .navlinks a[aria-current="page"]::after { width:100%; }
    /* One point more specific than `.navlinks a`, which was otherwise
       drawing this pill with `padding:4px 0`. */
    .navlinks a.navcta { border:1px solid var(--ink); border-radius:var(--radius-pill); padding:10px 20px; min-height:var(--tap-min); display:inline-flex; align-items:center; font-size:13px; letter-spacing:.03em; transition:.3s; white-space:nowrap; max-width:11em; overflow:hidden; text-overflow:ellipsis; }
    .navlinks a.navcta:hover { background:var(--ink); color:var(--bg); }
    .navlinks a.navcta::after { display:none; }
    .langtog { display:inline-flex; border:1px solid var(--line); border-radius:var(--radius-pill); overflow:hidden; margin-left:6px; }
    .langtog button { background:none; border:0; min-width:var(--tap-min); min-height:var(--tap-min); padding:8px 12px; font-size:13px; letter-spacing:.06em; color:var(--muted); cursor:pointer; font-family:inherit; }
    .langtog button.on { background:var(--ink); color:var(--bg); }
    .menu-btn { display:none; background:none; border:0; color:var(--ink); cursor:pointer; width:var(--tap-min); height:var(--tap-min); align-items:center; justify-content:center; padding:0; }
    .menu-btn svg { width:22px; height:22px; }
    #mnav a { font-size:15px; color:var(--ink2); }

    main { width:min(1100px,100%); margin:0 auto; padding:var(--space-phi-xl) var(--space-phi-md) var(--space-phi-2xl); }
    .intro { margin-bottom:var(--space-phi-xl); }
    .eyebrow { color:var(--muted); font-size:11px; font-weight:500; letter-spacing:.04em; }
    html[lang="en"] .eyebrow { letter-spacing:.32em; text-transform:uppercase; font-weight:400; }
    h1 { margin:var(--space-phi-sm) 0; font-family:var(--font-display); font-size:clamp(26px,5vw,42px); font-weight:500; line-height:1.07; letter-spacing:.01em; text-wrap:balance; }
    .lead { color:var(--ink2); font-size:16px; line-height:1.7; max-width:var(--brand-reading-measure); text-wrap:pretty; }
    .zone-note { margin-top:var(--space-phi-sm); color:var(--muted); font-size:13px; }

    /* A day is a heading and its rows. Grouping by DATE rather than by weekday
       is the whole reason this page exists: a rule says "every Wednesday", a
       visitor is asking "what about this Wednesday". */
    .day { margin-bottom:var(--space-phi-lg); }
    .day-head { display:flex; align-items:baseline; gap:10px; padding-bottom:var(--space-phi-xs); border-bottom:1px solid var(--line); }
    .day-date { font-family:var(--font-display); font-size:19px; font-weight:500; }
    .day-weekday { color:var(--muted); font-size:13px; }
    .day-today { margin-left:auto; padding:2px 10px; border:1px solid var(--accent-border); border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--on-accent-soft); font-size:11px; font-weight:500; }

    .class-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:var(--space-phi-sm) var(--space-phi-md); align-items:center; padding:var(--space-phi-md) 0; border-bottom:1px solid var(--line); }
    .class-time { font-variant-numeric:tabular-nums; font-size:15px; font-weight:500; white-space:nowrap; }
    .class-time small { display:block; color:var(--muted); font-weight:400; font-size:12px; }
    .class-title { font-size:16px; font-weight:500; }
    .class-sub { color:var(--muted); font-size:13px; }
    /* Facts as a wrapped list, not a fixed set of columns: the studio decides
       which of these exist, so the row cannot assume any of them. */
    .class-meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:2px; color:var(--ink2); font-size:13px; }
    /* Chip and button side by side, not stacked. Stacked, the button drifted
       a long way from the row it belongs to and the eye had to travel back up
       to see which class it was for. */
    .class-aside { display:flex; align-items:center; justify-content:flex-end; gap:var(--space-phi-sm); }

    /* Seats. Colour is the SECOND signal — every chip carries words, because a
       colour-blind visitor, a greyscale print and a screen reader all get the
       same three states only from the text (WCAG 1.4.1). None of them is a
       solid fill: the one saturated fill on this page is the booking button. */
    .chip { display:inline-flex; align-items:center; white-space:nowrap; padding:3px 11px; border-radius:var(--radius-pill); border:1px solid; font-size:12px; font-weight:500; }
    .chip-open { background:var(--success-soft); color:var(--on-success-soft); border-color:var(--success-border); }
    .chip-nearly { background:var(--warning-soft); color:var(--on-warning-soft); border-color:var(--warning-border); }
    /* Full is NEUTRAL, not danger. A class that sold out is an achievement,
       not a fault, and painting it red both misreads it and spends the colour
       this product reserves for things that actually went wrong. */
    .chip-full { background:transparent; color:var(--muted); border-color:var(--line-strong); }
    .chip-off { background:transparent; color:var(--muted); border-color:var(--line-strong); }

    .cancelled .class-title, .cancelled .class-time { text-decoration:line-through; text-decoration-thickness:1px; }
    .cancelled { color:var(--muted); }
    .cancel-note { color:var(--warning); font-size:13px; }

    .book-btn { min-height:var(--tap-min); padding:8px 18px; border:1px solid var(--clay); border-radius:var(--radius-pill); background:var(--clay); color:var(--on-accent); font:inherit; font-size:13px; font-weight:500; cursor:pointer; }
    .book-btn:hover { background:var(--clay-hover); }
    .book-btn:disabled { background:var(--disabled-surface); border-color:var(--disabled-surface); color:var(--disabled-text); cursor:not-allowed; }

    .empty { padding:var(--space-phi-xl); border:1px dashed var(--line-strong); border-radius:var(--radius-card); color:var(--muted); text-align:center; }

    dialog.book { width:min(460px,92vw); padding:0; border:1px solid var(--line); border-radius:var(--radius-card); background:var(--panel); color:var(--ink); }
    dialog.book::backdrop { background:var(--scrim); }
    .book-body { padding:var(--space-phi-lg); }
    .book-foot { display:flex; justify-content:flex-end; gap:10px; padding:var(--space-phi-md) var(--space-phi-lg); border-top:1px solid var(--line); }
    .book-body h2 { margin:0 0 var(--space-phi-xs); font-family:var(--font-display); font-size:21px; font-weight:500; }
    .book-for { margin:0 0 var(--space-phi-md); color:var(--ink2); font-size:14px; }
    .field { margin-bottom:14px; }
    label { display:block; margin-bottom:7px; color:var(--ink2); font-size:13px; font-weight:500; }
    input, textarea { width:100%; min-height:var(--tap-min); border:1px solid var(--line-strong); border-radius:var(--radius); padding:12px 14px; background:var(--bg); color:var(--ink); font:inherit; }
    input:focus, textarea:focus { outline:2px solid var(--focus-ring); outline-offset:2px; border-color:var(--clay); }
    textarea { resize:vertical; min-height:76px; }
    .hint { color:var(--muted); font-size:12px; margin-top:6px; }
    .form-error { display:none; margin-bottom:12px; padding:10px 12px; border:1px solid var(--danger-border); border-radius:var(--radius); background:var(--danger-soft); color:var(--on-danger-soft); font-size:13px; }
    .form-ok { padding:14px; border:1px solid var(--success-border); border-radius:var(--radius); background:var(--success-soft); color:var(--on-success-soft); font-size:14px; }
    .btn-quiet { min-height:var(--tap-min); padding:8px 18px; border:1px solid var(--line-strong); border-radius:var(--radius-pill); background:transparent; color:var(--ink); font:inherit; font-size:13px; cursor:pointer; }

    /* The portal's footer. A page that ends in a bare credit line reads as a
       dead end; this one ends the way every other page on the site does, with
       somewhere to go next and the studio's own contact details. */
    footer { background:var(--bg2); border-top:1px solid var(--line); padding:52px 0 40px; margin-top:var(--space-phi-2xl); }
    .foot { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px; width:min(1180px,100%); margin:0 auto; padding:0 var(--space-phi-md); }
    .foot .fn { font-family:var(--font-display); font-size:20px; font-weight:500; letter-spacing:.04em; display:block; margin-bottom:10px; }
    .foot .fcontact { font-size:13px; color:var(--ink2); margin:0 0 10px; }
    .foot .cp { font-size:13px; color:var(--ink2); margin:0; }
    .foot .fl { display:flex; gap:26px; font-size:13px; color:var(--ink2); flex-wrap:wrap; }
    .foot .fl a { color:var(--ink2); display:inline-flex; align-items:center; min-height:var(--tap-min); }

    @media (max-width:900px) {
      .navlinks { display:none; }
      .menu-btn { display:flex; }
    }
    @media (max-width:640px) {
      .navrow { padding:0 var(--space-phi-sm); }
      main { padding:var(--space-phi-lg) var(--space-phi-sm) var(--space-phi-xl); }
      /* The aside drops under the content rather than squeezing it: three
         columns at 360px would put "还有 3 位" on four lines. */
      .class-row { grid-template-columns:auto minmax(0,1fr); }
      .class-aside { grid-column:1/-1; justify-content:space-between; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
  </style>
</head>
<body data-tenant-slug="{{TENANT_SLUG}}">
  <!-- The portal's navigation, not a reduced one. Every link is a real <a
       href> for the same reasons it is there: Tab reaches it, "open in new
       tab" works, and a screen reader announces it.

       The hrefs are ABSOLUTE (/slug#home:courses), because this is a separate
       document — a bare "#home:courses" here would only move this page's
       fragment and go nowhere. That is the one thing that has to differ from
       index.html, and it is why these are written out rather than copied. -->
  <nav>
    <div class="navrow">
      <a class="brand" href="/{{TENANT_SLUG}}" aria-label="{{TENANT_NAME}}">
        <img id="tenantLogo" alt="" onerror="this.style.display='none'">
        <span class="bn" id="tenantName">{{TENANT_NAME}}</span>
      </a>
      <div class="navlinks">
      <!--@shell:nav-links-->
        <span class="langtog" role="group" aria-label="语言 / Language"><button type="button" data-language="zh" aria-pressed="true">中</button><button type="button" data-language="en" aria-pressed="false">EN</button></span>
      </div>
      <button class="menu-btn" type="button" aria-label="打开导航菜单" data-en-aria="Open navigation menu" aria-controls="mnav" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/></svg>
      </button>
    </div>
    <div id="mnav" style="display:none;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);padding:14px 28px 20px;gap:14px">
    <!--@shell:mnav-links-->
      <span class="langtog" role="group" aria-label="语言 / Language" style="align-self:flex-start"><button type="button" data-language="zh" aria-pressed="true">中</button><button type="button" data-language="en" aria-pressed="false">EN</button></span>
    </div>
  </nav>

  <main>
    <section class="intro">
      <div id="pageEyebrow" class="eyebrow" data-zh="课程安排" data-en="Timetable">课程安排</div>
      <h1 id="pageTitle" data-zh="接下来的公开课程" data-en="Upcoming public classes">接下来的公开课程</h1>
      <p id="pageLead" class="lead"></p>
      <p id="zoneNote" class="zone-note"></p>
      <p id="surfaceStatus" class="zone-note" role="status" aria-live="polite"></p>
    </section>

    <div id="days" aria-live="polite"></div>

    <div id="emptyState" class="empty" hidden>
      <p id="emptyText" data-zh="目前还没有公开的课程安排。" data-en="No classes are published at the moment.">目前还没有公开的课程安排。</p>
      <p><a id="emptyBack" href="/{{TENANT_SLUG}}" data-zh="返回工作室网站 →" data-en="Back to the studio website →">返回工作室网站 →</a></p>
    </div>
  </main>

  <footer>
    <div class="foot">
      <div>
        <span class="fn" id="footName">{{TENANT_NAME}}</span>
        <p class="fcontact" id="footContact"></p>
        <p class="cp">© 2026 <span id="footName2">{{TENANT_NAME}}</span><span id="producerCredit" hidden> · Powered by Paradise Production</span></p>
      </div>
      <div class="fl">
      <!--@shell:footer-links-->
      </div>
    </div>
  </footer>

  <dialog class="book" id="bookDialog" aria-labelledby="bookTitle">
    <form id="bookForm" novalidate>
      <div class="book-body">
        <h2 id="bookTitle" data-zh="预约这节课" data-en="Request a place">预约这节课</h2>
        <p class="book-for" id="bookFor"></p>
        <div class="form-error" id="bookError" role="alert"></div>
        <div id="bookFields">
          <div class="field">
            <label for="bookName" data-zh="学员全名 *" data-en="Student's full name *">学员全名 *</label>
            <input id="bookName" autocomplete="name" required aria-required="true">
            <p class="hint" id="bookNameHint" data-zh="填写学员本人的姓名，工作室用它核对记录。" data-en="The student's own name — the studio uses it to check their records.">填写学员本人的姓名，工作室用它核对记录。</p>
          </div>
          <div class="field">
            <label for="bookPhone" data-zh="手机号码 *" data-en="Mobile *">手机号码 *</label>
            <input id="bookPhone" type="tel" inputmode="tel" autocomplete="tel" required aria-required="true">
          </div>
          <div class="field">
            <label for="bookMessage" data-zh="备注（选填）" data-en="Note (optional)">备注（选填）</label>
            <textarea id="bookMessage"></textarea>
          </div>
          <p class="hint" id="bookPrivacy"></p>
        </div>
        <div class="form-ok" id="bookDone" hidden></div>
      </div>
      <div class="book-foot">
        <button type="button" class="btn-quiet" id="bookClose" data-zh="关闭" data-en="Close">关闭</button>
        <button type="submit" class="book-btn" id="bookSubmit" data-zh="发送预约申请" data-en="Send request">发送预约申请</button>
      </div>
    </form>
  </dialog>

  <script>
    const TENANT_SLUG = '{{TENANT_SLUG}}';
    const TENANT_NAME = {{TENANT_NAME_JSON}};
    const esc = window.StudioSaaS.esc;
    const API = `/v1/public/${encodeURIComponent(TENANT_SLUG)}`;
    let timetable = null;
    let publicBrand = {};
    let privacyNoticeVersion = '';
    let authoritativeSurface = null;
    let surfaceSettled = false;

    function refreshPublicSurfaceContract() {
      if (!window.StudioSaaS.publicSurface) return;
      if (authoritativeSurface) {
        window.StudioSaaS.publicSurface.apply(authoritativeSurface, document);
        return;
      }
      if (!surfaceSettled) return;
      const contract = window.StudioSaaS.publicSurface.resolve({
        slug: TENANT_SLUG, brand: publicBrand, timetable: timetable || { enabled: false, days: [] }
      });
      window.StudioSaaS.publicSurface.apply(contract, document);
    }
    window.StudioSaaS.publicSurface.fetch(API).then((contract) => {
      authoritativeSurface = contract;
      surfaceSettled = true;
      refreshPublicSurfaceContract();
    }).catch((error) => {
      surfaceSettled = true;
      refreshPublicSurfaceContract();
      const status = document.getElementById('surfaceStatus');
      if (status) status.textContent = currentLanguage === 'zh'
        ? '公开导航暂时无法确认；页面只显示本地已确认的入口。'
        : 'Public navigation could not be confirmed; only locally ready links are shown.';
      console.warn('Public surface contract unavailable; using locally confirmed content.', error);
    });

    const pageParams = new URLSearchParams(location.search);
    const normaliseLang = (value) => {
      const text = String(value || '').toLowerCase();
      if (text.startsWith('en')) return 'en';
      if (text.startsWith('zh')) return 'zh';
      return '';
    };
    let currentLanguage = normaliseLang(pageParams.get('lang')) || (() => {
      try {
        const stored = normaliseLang(localStorage.getItem(`pwe_lang_${TENANT_SLUG}`));
        if (stored) return stored;
      } catch (_) {}
      return normaliseLang((navigator.languages && navigator.languages[0]) || navigator.language) || 'zh';
    })();
    function T(zh, en) { return currentLanguage === 'en' ? en : zh; }
    function localized(pair, fallback) {
      if (pair && typeof pair === 'object') return pair[currentLanguage] || pair.en || pair.zh || fallback || '';
      const text = String(pair == null ? '' : pair).trim();
      return text || fallback || '';
    }

    const WEEKDAYS_ZH = ['周日','周一','周二','周三','周四','周五','周六'];
    const WEEKDAYS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    /* Dates arrive as plain YYYY-MM-DD strings already resolved in the STUDIO'S
       timezone by the server. They are split by hand rather than passed to
       `new Date(...)`, because that would reinterpret them in the visitor's
       zone and can move a class to the previous evening. This product has
       shipped that bug once already. */
    function formatDate(iso) {
      const [y, m, d] = String(iso).split('-').map(Number);
      return currentLanguage === 'en'
        ? `${d} ${['January','February','March','April','May','June','July','August','September','October','November','December'][m - 1]}`
        : `${m} 月 ${d} 日`;
    }

    function seatsChip(item) {
      if (typeof item.seatsLeft !== 'number') return '';
      if (item.seatsLeft === 0) {
        return `<span class="chip chip-full">${esc(T('已满 · 可加候补', 'Full · waitlist'))}</span>`;
      }
      const cls = item.nearlyFull ? 'chip-nearly' : 'chip-open';
      const text = item.nearlyFull
        ? T(`快满了 · 还有 ${item.seatsLeft} 位`, `Nearly full · ${item.seatsLeft} left`)
        : T(`还有 ${item.seatsLeft} 位`, `${item.seatsLeft} places left`);
      return `<span class="chip ${cls}">${esc(text)}</span>`;
    }

    function render() {
      const host = document.getElementById('days');
      const empty = document.getElementById('emptyState');
      const days = (timetable && timetable.days) || [];
      const anyClass = days.some((day) => day.classes.length);
      empty.hidden = anyClass;
      if (!anyClass) { host.innerHTML = ''; return; }

      host.innerHTML = days.filter((day) => day.classes.length).map((day) => {
        const isToday = timetable.today === day.date;
        const rows = day.classes.map((item) => {
          /* Facts are collected then joined, so a class with none of them
             renders no meta line at all rather than an empty one. The switch
             is the ceiling and the content is the floor. */
          const meta = [];
          if (item.teacher) meta.push(T(`${item.teacher} 老师`, item.teacher));
          if (item.room) meta.push(esc(item.room));
          if (item.ageRange) meta.push(T(`适龄 ${item.ageRange}`, `Ages ${item.ageRange}`));
          if (typeof item.priceAudCents === 'number') {
            meta.push(`A$${(item.priceAudCents / 100).toFixed(2)}`);
          }
          const chip = item.cancelled
            ? `<span class="chip chip-off">${esc(T('停课', 'Cancelled'))}</span>`
            : seatsChip(item);
          const canBook = item.bookable && item.seatsLeft !== 0;
          const button = item.bookable && !item.cancelled
            ? `<button type="button" class="book-btn" data-date="${esc(item.date)}" data-start="${esc(item.start)}"
                 data-title="${esc(item.title)}"${canBook ? '' : ' disabled'}>${
                 esc(canBook ? T('预约', 'Request') : T('已满', 'Full'))}</button>`
            : '';
          return `
            <div class="class-row${item.cancelled ? ' cancelled' : ''}">
              <div class="class-time">${esc(item.start)}${item.end ? `<small>→ ${esc(item.end)}</small>` : ''}</div>
              <div>
                <div class="class-title">${esc(item.title || T('课程', 'Class'))}</div>
                ${item.subtitle ? `<div class="class-sub">${esc(item.subtitle)}</div>` : ''}
                ${meta.length ? `<div class="class-meta">${meta.map((f) => `<span>${f}</span>`).join('')}</div>` : ''}
                ${item.cancelled && item.note ? `<div class="cancel-note">${esc(item.note)}</div>` : ''}
              </div>
              <div class="class-aside">${chip}${button}</div>
            </div>`;
        }).join('');
        return `
          <section class="day">
            <div class="day-head">
              <span class="day-date">${esc(formatDate(day.date))}</span>
              <span class="day-weekday">${esc((currentLanguage === 'en' ? WEEKDAYS_EN : WEEKDAYS_ZH)[day.weekday])}</span>
              ${isToday ? `<span class="day-today">${esc(T('今天', 'Today'))}</span>` : ''}
            </div>
            ${rows}
          </section>`;
      }).join('');

      host.querySelectorAll('.book-btn').forEach((button) => {
        button.addEventListener('click', () => openBooking(button.dataset));
      });
    }

    /* ── booking ─────────────────────────────────────────────────────────── */
    const dialog = document.getElementById('bookDialog');
    let booking = null;

    function openBooking(data) {
      booking = { date: data.date, start: data.start, title: data.title };
      document.getElementById('bookFor').textContent =
        `${formatDate(data.date)} · ${data.start} · ${data.title}`;
      document.getElementById('bookError').style.display = 'none';
      document.getElementById('bookDone').hidden = true;
      document.getElementById('bookFields').hidden = false;
      document.getElementById('bookSubmit').hidden = false;
      document.getElementById('bookSubmit').disabled = false;
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
      document.getElementById('bookName').focus();
    }
    function closeBooking() {
      if (typeof dialog.close === 'function') dialog.close();
      else dialog.removeAttribute('open');
    }
    document.getElementById('bookClose').addEventListener('click', closeBooking);

    document.getElementById('bookForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!booking) return;
      const name = document.getElementById('bookName').value.trim();
      const phone = document.getElementById('bookPhone').value.trim();
      const error = document.getElementById('bookError');
      if (!name || !phone) {
        error.textContent = T('请填写学员全名和手机号码。', 'Please enter the full name and a mobile number.');
        error.style.display = 'block';
        return;
      }
      const submit = document.getElementById('bookSubmit');
      submit.disabled = true;
      try {
        const response = await fetch(`${API}/timetable/book`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: booking.date, start: booking.start, name, phone,
            message: document.getElementById('bookMessage').value.trim(),
            language: currentLanguage,
            campaign: (window.StudioSaaSAnalytics && window.StudioSaaSAnalytics.campaign) || {},
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || T('提交失败，请稍后再试。', 'Could not send the request.'));

        /* Two honest sentences rather than one reassuring one. A parent who
           can see "1 place left" and sends the fourth request deserves to know
           that before they stop looking, not after the studio declines. */
        const queue = data.waiting > 1
          ? T(`目前有 ${data.waiting} 份申请在等待确认。`, `${data.waiting} requests are waiting to be confirmed.`)
          : '';
        const seats = typeof data.seatsLeft === 'number'
          ? T(`这节课还有 ${data.seatsLeft} 个位置。`, `This class has ${data.seatsLeft} place(s) left.`)
          : '';
        const head = data.duplicate
          ? T('已经收到了，请等待工作室确认。', 'We already have your request — please wait for the studio to confirm.')
          : T('已收到，工作室确认后会联系你。', 'Received. The studio will contact you once it is confirmed.');
        document.getElementById('bookDone').textContent = [head, seats, queue].filter(Boolean).join(' ');
        document.getElementById('bookDone').hidden = false;
        document.getElementById('bookFields').hidden = true;
        submit.hidden = true;
        error.style.display = 'none';
        if (window.StudioSaaSAnalytics) window.StudioSaaSAnalytics.track('cta_click', { label: 'class_booking' });
      } catch (exception) {
        error.textContent = exception.message;
        error.style.display = 'block';
        submit.disabled = false;
      }
    });

    /* The mobile menu, kept to what this page needs: open, close on Escape,
       close when a link is followed. No focus trap — it is a list of links,
       not a dialog, and a trap nobody can leave is worse than no trap. */
    const menuButton = document.querySelector('.menu-btn');
    const mobileNav = document.getElementById('mnav');
    function setMobileNav(open) {
      mobileNav.style.display = open ? 'flex' : 'none';
      menuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    menuButton.addEventListener('click', () => setMobileNav(mobileNav.style.display === 'none'));
    mobileNav.addEventListener('click', (event) => {
      if (event.target.closest('a')) setMobileNav(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && mobileNav.style.display !== 'none') {
        setMobileNav(false);
        menuButton.focus();
      }
    });

    /* ── language and brand ──────────────────────────────────────────────── */
    function syncLocaleMeta() {
      const base = location.origin + location.pathname;
      const set = (id, attr, value) => { const el = document.getElementById(id); if (el) el[attr] = value; };
      set('ogLocale', 'content', currentLanguage === 'en' ? 'en_US' : 'zh_CN');
      set('ogLocaleAlternate', 'content', currentLanguage === 'en' ? 'zh_CN' : 'en_US');
      set('altLangZh', 'href', base);
      set('altLangEn', 'href', `${base}?lang=en`);
      set('altLangDefault', 'href', base);
      set('canonicalUrl', 'href', currentLanguage === 'en' ? `${base}?lang=en` : base);
      try {
        const params = new URLSearchParams(location.search);
        if (currentLanguage === 'en') params.set('lang', 'en'); else params.delete('lang');
        const query = params.toString();
        history.replaceState(null, '', location.pathname + (query ? `?${query}` : '') + location.hash);
      } catch (_) {}
    }

    function applyLanguage() {
      document.documentElement.lang = currentLanguage === 'en' ? 'en' : 'zh-CN';
      syncLocaleMeta();
      document.querySelectorAll('[data-zh][data-en]').forEach((element) => {
        element.textContent = element.dataset[currentLanguage];
      });
    document.querySelectorAll('[data-language]').forEach((button) => {
        const active = button.dataset.language === currentLanguage;
        button.classList.toggle('on', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      if (timetable) {
        const eyebrow = localized(timetable.label, '');
        if (eyebrow) document.getElementById('pageEyebrow').textContent = eyebrow;
        document.getElementById('pageLead').textContent = localized(timetable.lead, '');
        document.getElementById('zoneNote').textContent = timetable.timezone
          ? T(`时间以工作室所在时区为准（${timetable.timezone}）。`,
              `Times are in the studio's timezone (${timetable.timezone}).`)
          : '';
      }
      document.getElementById('bookPrivacy').textContent = privacyNoticeVersion
        ? T(`提交即表示你同意工作室为安排课程使用这些信息。隐私说明版本：${privacyNoticeVersion}`,
            `By sending this you agree the studio may use these details to arrange the class. Privacy note version: ${privacyNoticeVersion}`)
        : '';
      try { localStorage.setItem(`pwe_lang_${TENANT_SLUG}`, currentLanguage); } catch (_) {}
      render();
    }

    document.querySelectorAll('[data-language]').forEach((button) => {
      button.addEventListener('click', () => {
        currentLanguage = button.dataset.language === 'en' ? 'en' : 'zh';
        applyLanguage();
      });
    });

    fetch(`${API}/brand`).then((r) => (r.ok ? r.json() : null)).then((data) => {
      const brand = (data && data.brand) || {};
      publicBrand = brand;
      window.StudioSaaS.applyVisualTheme(brand);
      privacyNoticeVersion = String(brand.privacyNoticeVersion || brand.privacy_notice_version || '');
      const studioName = brand.name || TENANT_NAME;
      document.getElementById('tenantName').textContent = studioName;
      document.getElementById('footName').textContent = studioName;
      document.getElementById('footName2').textContent = studioName;
      /* Contact moved out of the nav and into the footer, where the portal
         keeps it — a phone number squeezed under the studio name in a 74px
         bar was legible on a desktop and truncated on every phone. */
      document.getElementById('footContact').textContent =
        [brand.contact_phone || brand.contactPhone, brand.contact_email || brand.contactEmail,
         brand.address].filter(Boolean).join(' · ');
      const logo = document.getElementById('tenantLogo');
      const rawLogo = brand.logo_url || brand.logoUrl || '';
      /* A configured-but-missing image must disappear, not leave a broken
         glyph in the nav — the same rule the portal applies to it. */
      const logoUrl = ['/logo.png', '/logo-light.png', '/favicon.svg'].includes(rawLogo) ? '' : rawLogo;
      if (logoUrl) { logo.src = logoUrl; logo.alt = ''; logo.style.display = 'block'; }

      /* The nav links follow the studio's own section switches, so this page
         never offers a link to a section the home page does not have. Every
         one starts hidden in the markup: showing a link and then withdrawing
         it is worse than revealing it a moment late. */
      refreshPublicSurfaceContract();
      applyLanguage();
    }).catch((error) => {
      document.getElementById('surfaceStatus')?.replaceChildren(document.createTextNode(T('品牌资料暂时无法确认，请稍后重试。', 'Brand details could not be confirmed. Please retry.')));
      console.warn('Timetable brand request failed.', error);
    });

    fetch(`${API}/timetable`).then((r) => (r.ok ? r.json() : null)).then((data) => {
      timetable = data || { enabled: false, days: [] };
      /* Switched off is not an error: the server answers `enabled: false` and
         the page says so plainly instead of showing a failure to a visitor who
         did nothing wrong. */
      if (!timetable.enabled) timetable.days = [];
      refreshPublicSurfaceContract();
      applyLanguage();
    }).catch((error) => { timetable = { enabled: false, days: [] }; refreshPublicSurfaceContract(); applyLanguage(); console.warn('Timetable request failed.', error); });

    fetch('/v1/health', { cache: 'no-store' })
      .then((response) => response.json())
      .then((health) => { document.getElementById('producerCredit').hidden = !health.showProducerCredit; })
      .catch((error) => console.warn('Producer credit health unavailable.', error));

    applyLanguage();
  </script>
</body>
</html>
