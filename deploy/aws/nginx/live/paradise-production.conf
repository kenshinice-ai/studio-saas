# Paradise Production — the studio's own marketing site, served as plain files
# from a subdirectory of the SaaS host. Nothing here reaches the application:
# `^~` beats the generic prefix `location /`, so nginx stops matching and never
# consults the upstream. The app is untouched, including its own `/assets/…`
# route and its `/<tenant_slug>` catch-all.
#
# The trailing slash in `^~ /paradise-production/` is deliberate. Without it the
# block would also swallow sibling slugs such as `/paradise-production-2`.

# 一方埋点收集端点。只把请求行写进独立日志然后立刻 204 ——
# 不落地文件、不设 cookie、不引第三方，所以不需要同意横幅。
# `=` 精确匹配优先级高于下面的 `^~`，不会被 try_files 当成缺失文件。
location = /paradise-production/_e {
    access_log /var/log/nginx/paradise-events.log;
    add_header Cache-Control "no-store" always;
    return 204;
}

location = /paradise-production {
    return 301 /paradise-production/;
}

location ^~ /paradise-production/ {
    root /var/www;

    # Reproduces the Cloudflare Pages convention the pages are generated for:
    # root-relative and extensionless (`/paradise-production/pwe-studio`, `/en/`).
    try_files $uri $uri.html $uri/index.html =404;

    # Indexable. This copy is the canonical one: every page carries
    # <link rel="canonical"> pointing here, and the Cloudflare Pages copy stays
    # noindex so the two never compete for the same queries.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # Assets get a real TTL, but not the year-long `immutable` the Cloudflare
    # `_headers` file used: these filenames carry no content hash, and there is
    # no purge button on this box. A week is long enough to matter and short
    # enough that replacing a photo actually reaches visitors.
    # nginx drops inherited `add_header` in a nested block, so the security
    # headers are repeated rather than assumed.
    location ~* ^/paradise-production/assets/ {
        root /var/www;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
