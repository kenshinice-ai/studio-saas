# nginx site config for StudioSaaS on EC2 (TLS termination + reverse proxy).
# NOTE: this file references certificates that exist only AFTER certbot has
# run — bootstrap a fresh host with studiosaas-bootstrap.conf first (§6 of
# README_AWS.md), or use a Cloudflare Origin Cert if the zone stays proxied.

upstream studiosaas_app {
    server 127.0.0.1:8899;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pwestudio.online www.pwestudio.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Single canonical host. www holds the same certificate (one SAN lineage) so
# the redirect happens over TLS, never by downgrading to http.
server {
    # Ubuntu 24.04 ships nginx 1.24, where HTTP/2 is a `listen` parameter. The
    # `http2 on;` directive only exists from 1.25.1 and fails `nginx -t` here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pwestudio.online;

    ssl_certificate     /etc/letsencrypt/live/pwestudio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwestudio.online/privkey.pem;
    include             /etc/nginx/snippets/pwestudio-tls.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://pwestudio.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pwestudio.online;

    ssl_certificate     /etc/letsencrypt/live/pwestudio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pwestudio.online/privkey.pem;
    include             /etc/nginx/snippets/pwestudio-tls.conf;

    server_tokens off;

    # Media uploads (CMS portfolio photos) — matches the app's 20MB cap.
    client_max_body_size 20m;

    # Text responses compress well; images are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app trusts proxy headers only from localhost (_client_ip), which is
    # exactly this topology: nginx and waitress share the instance.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The application already sends CSP, X-Frame-Options, Permissions-Policy,
    # Referrer-Policy and X-Content-Type-Options on every response it generates
    # (backend/server.py:777-796). Repeating them here only put duplicate
    # headers on the wire. HSTS stays at the edge on purpose: it must also cover
    # responses the application never produced — nginx's own 502/504 when the
    # container is down is exactly when a downgrade must not be offered.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://studiosaas_app;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_intercept_errors on;
        error_page 502 503 504 /__maintenance.html;
    }

    # An upgrade restarts the application container for a few seconds. Without
    # this the visitor gets nginx's stock "502 Bad Gateway", which reads like the
    # studio's website is broken rather than briefly updating.
    location = /__maintenance.html {
        root /var/www/pwestudio;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
    }
}
