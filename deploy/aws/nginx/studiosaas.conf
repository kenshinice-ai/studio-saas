# nginx site config for StudioSaaS on EC2 (TLS termination + reverse proxy).
# NOTE: this file references certificates that exist only AFTER certbot has
# run — bootstrap a fresh host with studiosaas-bootstrap.conf first (§6 of
# README_AWS.md), or use a Cloudflare Origin Cert if the zone stays proxied.

upstream studiosaas_app {
    server 127.0.0.1:8899;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name studiosaas.cc.cd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studiosaas.cc.cd;

    ssl_certificate     /etc/letsencrypt/live/studiosaas.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosaas.cc.cd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # Media uploads (CMS portfolio photos) — matches the app's 20MB cap.
    client_max_body_size 20m;

    # Text responses compress well; images are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app trusts proxy headers only from localhost (_client_ip), which is
    # exactly this topology: nginx and waitress share the instance.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://studiosaas_app;
        proxy_read_timeout 60s;
    }
}
