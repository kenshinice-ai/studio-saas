<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PWE Studio · 正在更新</title>
<style>
  :root{
    --family-navy:#0e1729; --family-amber:#f5b335; --warm-paper:#f7f5f2;
    --slate-600:#475569;
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:var(--warm-paper);color:var(--family-navy);padding:2rem}
  .card{max-width:30rem;text-align:center}
  .mark{width:3rem;height:3rem;margin:0 auto 1.5rem;border-radius:.75rem;
        background:var(--family-navy);display:grid;place-items:center}
  .mark span{color:var(--family-amber);font-size:1.5rem;font-weight:800;line-height:1}
  h1{font-size:1.5rem;line-height:1.3;margin:0 0 .75rem}
  p{color:var(--slate-600);line-height:1.6;margin:0 0 .5rem}
  .sub{font-size:.8125rem;margin-top:1.5rem;color:#64748b}
  @media (prefers-color-scheme:dark){
    body{background:var(--family-navy);color:var(--warm-paper)}
    p{color:#94a3b8}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><span>P</span></div>
    <h1>正在更新，马上回来</h1>
    <p>PWE Studio is updating and will be back in a moment.</p>
    <p>你的数据没有受到影响。请稍等约 30 秒后刷新页面。</p>
    <p class="sub">Your data is unaffected. Refresh in about 30 seconds.</p>
  </div>
</body>
</html>
