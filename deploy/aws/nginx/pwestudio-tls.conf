# Shared TLS parameters for every pwestudio.online server block.
# Installed to /etc/nginx/snippets/pwestudio-tls.conf and `include`d, so the
# apex and the www redirect block cannot drift apart — a hardened apex next to
# a default-configured www block is a downgrade path hiding in plain sight.
#
# certbot only writes /etc/letsencrypt/options-ssl-nginx.conf when it manages
# the nginx config itself (`--nginx`). This deployment uses
# `certonly --webroot`, so that file does not exist and these values are ours
# to state explicitly rather than inherit by accident.

ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 ignores this list and negotiates its own suites. For 1.2 the set is
# limited to forward-secret AEAD suites: no CBC (Lucky13), no RSA key exchange
# (no forward secrecy), no 3DES.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Let the client choose. Modern clients order by what their hardware does
# fastest, and every suite above is acceptable to us.
ssl_prefer_server_ciphers off;

# Resumption cuts a full handshake off repeat visits. Tickets are off because a
# single-instance deployment gains nothing from them and they weaken forward
# secrecy unless the ticket key is rotated, which nothing here does.
ssl_session_cache shared:pwestudio_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# NO OCSP stapling, deliberately. Every nginx hardening guide tells you to turn
# it on, and it is now dead configuration for Let's Encrypt: the issued
# certificate carries no OCSP responder URL in its Authority Information
# Access extension — only `CA Issuers - URI:http://ye1.i.lencr.org/` — because
# Let's Encrypt retired OCSP in favour of short lifetimes plus CRLs. Verify on
# any renewal with:
#
#     openssl s_client -connect pwestudio.online:443 -servername pwestudio.online \
#       </dev/null 2>/dev/null | openssl x509 -noout -ocsp_uri     # prints nothing
#
# With `ssl_stapling on` nginx accepts the config but logs
# `"ssl_stapling" ignored, no OCSP responder URL in the certificate`
# on every reload — a permanent warning that trains the operator to skip
# reload output, which is where the errors that DO matter appear.
