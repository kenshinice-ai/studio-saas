# BOOTSTRAP config — HTTP only, no certificate references.
#
# The full studiosaas.conf hard-references /etc/letsencrypt/live/... which
# does not exist before certbot runs, so `nginx -t` (and therefore
# `certbot --nginx`) fails — a chicken-and-egg deadlock for a fresh operator.
# Deploy THIS file first, let certbot mint the certificate and rewrite the
# server block, then (optionally) replace with studiosaas.conf as the
# hand-maintained reference. See README_AWS.md §6.

upstream studiosaas_app {
    server 127.0.0.1:8899;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pwestudio.online www.pwestudio.online;

    server_tokens off;
    client_max_body_size 20m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ACME HTTP-01 must be answered by nginx itself; proxying it to the
    # application would make every renewal fail once the app is unhealthy.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://studiosaas_app;
        proxy_read_timeout 60s;
    }
}
