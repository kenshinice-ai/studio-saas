# StudioSaaS — AWS/staging compose file.
#
# On AWS the recommended database is RDS PostgreSQL: leave the `db` profile off
# and point STUDIOSAAS_DATABASE_URL at RDS. The bundled `db` service exists for
# a single-box staging rehearsal (`--profile local-db`) only.
#
#   cp deploy/aws/.env.example deploy/aws/.env   # then fill in secrets
#   docker compose -f deploy/aws/docker-compose.yml --env-file deploy/aws/.env up -d
#
# With local db rehearsal:
#   docker compose -f deploy/aws/docker-compose.yml --env-file deploy/aws/.env \
#     --profile local-db up -d

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile
    image: studiosaas:${STUDIOSAAS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:8899"   # nginx on the host terminates TLS and proxies here
    environment:
      STUDIOSAAS_ENV: ${STUDIOSAAS_ENV:-production}
      # RDS deployments set this directly. The Lightsail override replaces it
      # with the bounded in-stack role; entrypoint.sh rejects an empty value.
      STUDIOSAAS_DATABASE_URL: ${STUDIOSAAS_DATABASE_URL:-}
      STUDIOSAAS_SESSION_SECRET: ${STUDIOSAAS_SESSION_SECRET}
      STUDIOSAAS_API_KEY: ${STUDIOSAAS_API_KEY}
      STUDIOSAAS_PUBLIC_BASE_DOMAIN: ${STUDIOSAAS_PUBLIC_BASE_DOMAIN:-}
      STUDIOSAAS_SEED_SUPER_ADMIN: ${STUDIOSAAS_SEED_SUPER_ADMIN:-0}
      # Email delivery (SES SMTP in production; console = log-only default)
      STUDIOSAAS_EMAIL_BACKEND: ${STUDIOSAAS_EMAIL_BACKEND:-console}
      STUDIOSAAS_SMTP_HOST: ${STUDIOSAAS_SMTP_HOST:-}
      STUDIOSAAS_SMTP_PORT: ${STUDIOSAAS_SMTP_PORT:-587}
      STUDIOSAAS_SMTP_USER: ${STUDIOSAAS_SMTP_USER:-}
      STUDIOSAAS_SMTP_PASSWORD: ${STUDIOSAAS_SMTP_PASSWORD:-}
      STUDIOSAAS_SMTP_FROM: ${STUDIOSAAS_SMTP_FROM:-}
      # DB wait ceilings (ms) and support-gate override — documented tunables
      STUDIOSAAS_DB_CONNECT_TIMEOUT: ${STUDIOSAAS_DB_CONNECT_TIMEOUT:-5}
      STUDIOSAAS_DB_STATEMENT_TIMEOUT_MS: ${STUDIOSAAS_DB_STATEMENT_TIMEOUT_MS:-30000}
      STUDIOSAAS_DB_LOCK_TIMEOUT_MS: ${STUDIOSAAS_DB_LOCK_TIMEOUT_MS:-10000}
      STUDIOSAAS_ENFORCE_SUPPORT_GATE: ${STUDIOSAAS_ENFORCE_SUPPORT_GATE:-1}
      COOKIE_SECURE: "1"
      PORT: "8899"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - studiosaas-data:/data
      - studiosaas-media:/media
      # Tenant archive/permanent-delete snapshots — legal retention (incl.
      # publication-consent evidence). Must survive image replacement.
      - studiosaas-archives:/app/backend/archives
      # Runtime-created tenant portal workspaces — without this volume a
      # tenant created on AWS loses its portal on the next image rebuild.
      # entrypoint.sh repopulates it from the template on every boot.
      - studiosaas-tenants:/app/tenants

  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studiosaas
      POSTGRES_USER: studiosaas
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD for the local-db profile}
    volumes:
      - studiosaas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiosaas -d studiosaas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  studiosaas-data:
  studiosaas-media:
  studiosaas-archives:
  studiosaas-tenants:
  studiosaas-pgdata:
