<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e1729">
  <title>Studio CMS · Tenant operations</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --navy: #0e1729;
      --navy-raised: #16233d;
      --amber: #f5b335;
      --amber-text: #a16207;   /* readable on light surfaces; #f5b335 is not */
      --paper: #f7f5f2;
      --surface: #ffffff;
      --slate: #475569;
      --line: #cbd5e1;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 34px 21px;
      background: var(--paper);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(100%, 610px);
      display: grid;
      grid-template-columns: 1.618fr 1fr;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 21px;
      box-shadow: 0 21px 55px rgba(14, 23, 41, .12);
    }
    .intro { padding: 34px; background: var(--navy); color: var(--surface); }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--amber);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); line-height: 1.08; }
    .intro p:last-child { margin: 21px 0 0; color: #cbd5e1; }
    .entry { padding: 34px 21px; align-self: center; }
    label { display: block; margin-bottom: 8px; font-weight: 750; }
    input, button, a {
      min-height: 44px;
      border-radius: 10px;
      font: inherit;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      color: var(--navy);
    }
    /* Was rgba(245,179,53,.55): composited it measures 1.40:1 on white and
       1.34:1 on paper, well under the 3:1 WCAG 1.4.11 requires of a focus
       indicator — the translucency made it worse than the solid amber, which
       is itself already too light. The accessible amber is 4.92:1 / 4.52:1. */
    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--amber-text);
      outline-offset: 2px;
    }
    /* The navy panel is the one place the bright amber is the readable ring. */
    .panel-dark :focus-visible { outline-color: var(--amber); }
    button {
      width: 100%;
      margin-top: 13px;
      padding: 10px 14px;
      border: 0;
      background: var(--amber);
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }
    .help { margin: 8px 0 0; color: var(--slate); font-size: 13px; }
    .error { margin: 10px 0 0; color: var(--danger); font-weight: 700; }
    .links { display: grid; gap: 8px; margin-top: 21px; }
    .links a { display: inline-flex; align-items: center; color: var(--navy-raised); font-weight: 750; }
    @media (max-width: 620px) {
      main { grid-template-columns: 1fr; }
      .intro, .entry { padding: 21px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <p class="eyebrow">PWE Studio · Operations</p>
      <h1>Open your studio CMS.</h1>
      <p>学员、排课、签到、课时、作品与报表都在租户自己的运营后台中完成。</p>
    </section>
    <section class="entry" aria-labelledby="entry-title">
      <h2 id="entry-title">Choose a tenant</h2>
      <form id="tenantCmsForm" novalidate>
        <label for="tenantSlug">Studio URL slug</label>
        <input id="tenantSlug" name="tenantSlug" required autocomplete="organization"
               inputmode="url" pattern="[a-z0-9][a-z0-9-]{1,62}"
               placeholder="your-studio-slug" aria-describedby="slugHelp cmsError">
        <p id="slugHelp" class="help">例如：lets-paint-showcase。系统不会自动选择或恢复旧租户。</p>
        <p id="cmsError" class="error" role="alert" hidden></p>
        <button type="submit">Continue to CMS</button>
      </form>
      <div class="links">
        <a href="/lets-paint-showcase/cms">Open the professional demo CMS →</a>
        <a href="/">Back to product home</a>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById('tenantCmsForm');
    const input = document.getElementById('tenantSlug');
    const error = document.getElementById('cmsError');
    const slugPattern = /^[a-z0-9][a-z0-9-]{1,62}$/;
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const slug = input.value.trim().toLowerCase();
      if (!slugPattern.test(slug)) {
        error.textContent = 'Enter a valid lowercase studio slug.';
        error.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }
      error.hidden = true;
      input.removeAttribute('aria-invalid');
      location.assign(`/${encodeURIComponent(slug)}/cms`);
    });
    input.addEventListener('input', () => {
      error.hidden = true;
      input.removeAttribute('aria-invalid');
    });
  </script>
</body>
</html>
