        d="M 14 10 H 36 A 14 14 0 0 1 36 38 H 25 V 54 H 14 Z
           M 28 16 H 38.5 A 3 3 0 0 1 41.5 19 V 29 A 3 3 0 0 1 38.5 32 H 28 A 3 3 0 0 1 25 29 V 19 A 3 3 0 0 1 28 16 Z"/>
  <!-- E arms (spine = the P stem) -->
  <g fill="#0F172A">
    <rect x="25" y="16" width="10.5" height="3.5" rx="1.75"/>
    <rect x="25" y="22.25" width="8" height="3.5" rx="1.75"/>
    <rect x="25" y="28.5" width="10.5" height="3.5" rx="1.75"/>
  </g>
  <path fill="#F59E0B"
        d="M 33.5 39 Q 33.5 45.5 40 45.5 Q 33.5 45.5 33.5 52 Q 33.5 45.5 27 45.5 Q 33.5 45.5 33.5 39 Z"/>
