<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Studio CMS</title>
    <script src="/assets/ui-common.js"></script>
    <link rel="stylesheet" href="/assets/ui-tokens.css">
    <link rel="stylesheet" href="/assets/brand-system.css">
    <link rel="icon" href="/icon-192.png">
    <!-- G6: PWA — 添加到主屏幕 -->
    <link id="cmsManifest" rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#312e81">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Studio CMS">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      /* S1 (v6.6.5): register the SW scoped to this tenant page only, and
       * unregister historical root-scope registrations so the SW never
       * intercepts other surfaces. */
      if ('serviceWorker' in navigator)
        window.addEventListener('load', () => {
          const match = location.pathname.match(/^\/([^/]+)\/cms\/?$/);
          const scope = match ? `/${match[1]}/` : '/';
          const cleanup = scope === '/' ? Promise.resolve() :
            navigator.serviceWorker.getRegistrations().then((regs) =>
              Promise.all(regs.filter((r) => new URL(r.scope).pathname === '/').map((r) => r.unregister()))
            ).catch(() => {});
          Promise.resolve(cleanup).then(() =>
            navigator.serviceWorker.register('/sw.js', { scope }).catch(() => {}));
        });
    </script>
    <script>
      (() => {
        const fromPath = location.pathname.match(/^\/([^/]+)(?:\/cms)?\/?$/);
        const tenantSlug = new URLSearchParams(location.search).get('tenant') || (fromPath && fromPath[1]) || '';
        if (!tenantSlug) return;
        window.STUDIOSAAS_TENANT_SLUG = tenantSlug;
        const setTenantTheme = (brand) => {
          if (!brand) return;
          const root = document.documentElement;
          const visual = brand.visual_theme || brand.visualTheme || {};
          const primary = visual.accent_color || visual.accentColor || brand.primary_color || brand.primaryColor || '#312e81';
	          const secondary = visual.secondary_accent_color || visual.secondaryAccentColor || brand.secondary_color || brand.secondaryColor || '#6366f1';
	          const rawLogo = brand.logo_url || brand.logoUrl || '';
	          const logo = ['/logo.png', '/logo-light.png', '/favicon.svg'].includes(rawLogo) ? '' : rawLogo;
	          const slogan = brand.slogan || 'Learn, grow, and feel confident.';
	          root.style.setProperty('--tenant-primary', primary);
          root.style.setProperty('--brand-accent', primary);
          root.style.setProperty('--tenant-primary-soft', `${primary}14`);
          root.style.setProperty('--tenant-primary-border', `${primary}40`);
          root.style.setProperty('--tenant-secondary', secondary);
          root.style.setProperty('--brand-accent-strong', secondary);
          /* The same declarative map the portal and register page use
             (tenant-template/register.html:364), so the three tenant surfaces
             can never apply a different subset of a theme again. This used to
             carry 10 of the 21 tokens: border_strong_color, the accent
             hover/pressed states, focus_ring_color, the disabled pair and the
             scrim were all missing, so a studio that picked one of the eight
             palettes got a CMS that was only partly theirs. */
          const themeVars = {
            background_color:       ['--bg', '--brand-paper'],
            background_alt_color:   ['--bg2'],
            panel_color:            ['--panel', '--surface', '--brand-paper-raised'],
            text_color:             ['--ink', '--brand-ink'],
            text_soft_color:        ['--ink2'],
            muted_text_color:       ['--muted', '--brand-ink-soft'],
            border_color:           ['--line', '--brand-line'],
            border_strong_color:    ['--line-strong'],
            accent_color:           ['--accent', '--brand-accent'],
            accent_hover_color:     ['--accent-hover'],
            accent_pressed_color:   ['--accent-pressed'],
            accent_text_color:      ['--on-accent', '--brand-on-accent'],
            secondary_accent_color: ['--accent-dark', '--brand-accent-strong'],
            secondary_text_color:   ['--on-secondary', '--brand-on-secondary'],
            success_color:          ['--success', '--brand-success'],
            warning_color:          ['--warning', '--brand-warning'],
            danger_color:           ['--danger', '--brand-danger'],
            focus_ring_color:       ['--focus-ring'],
            disabled_surface_color: ['--disabled-surface'],
            disabled_text_color:    ['--disabled-text'],
            scrim_color:            ['--scrim']
          };
          Object.entries(themeVars).forEach(([key, cssVars]) => {
            const camel = key.replace(/_([a-z])/g, (_, char) => char.toUpperCase());
            const value = visual[key] || visual[camel];
            if (value) cssVars.forEach((cssVar) => root.style.setProperty(cssVar, value));
          });
          root.dataset.brandScheme = visual.color_scheme || visual.colorScheme || 'light';
          root.style.setProperty('--tenant-secondary-soft', `${secondary}14`);
          root.style.setProperty('--tenant-secondary-border', `${secondary}40`);
		          if (brand.name) document.title = `${brand.name} CMS`;
		          document.querySelectorAll('.tenant-slogan').forEach((el) => {
		            el.textContent = slogan;
		          });
                  window.dispatchEvent(new CustomEvent('studiosaas:brand', {detail: brand}));
        };
        const scheduleTenantTheme = () => {
          setTenantTheme(window.STUDIOSAAS_BRAND);
          setTimeout(() => setTenantTheme(window.STUDIOSAAS_BRAND), 300);
          setTimeout(() => setTenantTheme(window.STUDIOSAAS_BRAND), 1200);
          setTimeout(() => setTenantTheme(window.STUDIOSAAS_BRAND), 3000);
        };
        window.STUDIOSAAS_REGISTER_URL = `${location.origin}/${tenantSlug}/register`;
        const manifestLink = document.getElementById('cmsManifest');
        if (manifestLink) manifestLink.href = `/${encodeURIComponent(tenantSlug)}/manifest-cms.json`;
        window.STUDIOSAAS_TENANT_SLUG = tenantSlug;
        window.STUDIOSAAS_APPLY_BRAND = setTenantTheme;
        window.addEventListener('load', scheduleTenantTheme);
        const originalFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const raw = typeof input === 'string' ? input : (input && input.url) || '';
          const url = new URL(raw, location.origin);
          let next = input;
          if (url.origin === location.origin && url.pathname === '/api/data') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/data`;
          } else if (url.origin === location.origin && url.pathname === '/api/save') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/save`;
          } else if (url.origin === location.origin && url.pathname === '/api/upload') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/media/upload`;
          } else if (url.origin === location.origin && url.pathname === '/api/portfolio/upload') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/portfolio/upload`;
          } else if (url.origin === location.origin && url.pathname.startsWith('/api/portfolio/') && url.pathname !== '/api/portfolio/token') {
            const rest = url.pathname.slice('/api/portfolio/'.length);
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/portfolio/${rest}${url.search}`;
          }
          return originalFetch(next, init);
        };
        originalFetch(`/v1/public/${encodeURIComponent(tenantSlug)}/brand`)
          .then((res) => res.ok ? res.json() : null)
          .then((data) => {
            const brand = data && data.brand;
            window.STUDIOSAAS_BRAND = brand;
            scheduleTenantTheme();
          })
          .catch(() => {});
      })();
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        /* ── Fix #4: prevent iOS auto-zoom on inputs (requires font-size ≥ 16px) ── */
        input, textarea, select { font-size: 16px !important; }

        /* v8.0.1 golden-ratio dashboard hierarchy. Data tables stay dense;
           only the decision-oriented dashboard lead uses a 61.8/38.2 split. */
        .cms-dashboard-root {
            width: 100%;
            max-width: var(--ui-content-max, 89rem);
            margin-inline: auto;
        }
        .cms-dashboard-lead {
            display: grid;
            gap: var(--ui-space-4, 21px);

                grid-template-columns: var(--ui-golden-columns, minmax(0, 1.618fr) minmax(0, 1fr));
                align-items: start;

            .cms-kpi-grid { gap: var(--ui-space-2, 8px); }
        }


        /* ── B6: 深色模式（跟随系统）— 收割自 LetsPaintCMS v5.0.x 两轮收口成品。
           中性色表面/文字 + 彩色浅底(-50/-100)一并映射为深色同色调，
           保证任何"彩底 + 文字"组合都有足够对比度。
           如需临时关闭，把整段删掉即可，不影响其他逻辑。 */
        @media (prefers-color-scheme: dark) {
            html, body { background:#0e1016 !important; }
            body { color:#e5e7eb; }
            /* 中性表面 */
            .bg-white { background:#1a1d27 !important; }
            .bg-gray-50 { background:#20242f !important; }
            .bg-gray-100 { background:#0e1016 !important; }
            /* 中性文字 */
            .text-gray-900, .text-gray-800 { color:#e8eaf0 !important; }
            .text-gray-700, .text-gray-600 { color:#c3c8d4 !important; }
            .text-gray-500, .text-gray-400 { color:#8b93a5 !important; }
            .text-gray-300 { color:#5b6473 !important; }
            /* 边框 */
            .border-gray-100, .border-gray-200, .border-gray-300 { border-color:#2c313d !important; }
            .divide-gray-50 > *, .divide-gray-100 > * { border-color:#252a35 !important; }
            .hover-row:hover { background:#20242f !important; }

            /* 表单控件：原生白底不是 .bg-white 类，需单独覆盖 */
            input, textarea, select { background:#1a1d27 !important; color:#e8eaf0 !important; border-color:#2c313d !important; color-scheme: dark; }
            input::placeholder, textarea::placeholder { color:#6b7280 !important; }

            /* 透明度变体彩色浅底 */
            .bg-indigo-50\/60 { background:#1e2140 !important; }
            .bg-amber-50\/60  { background:#382e18 !important; }
            /* 中性灰按钮/色块底 */
            .bg-gray-200 { background:#2c313d !important; }
            .bg-gray-300 { background:#363c4a !important; }
            .disabled\:bg-gray-300:disabled { background:#2a2f3a !important; }
            .disabled\:bg-gray-200:disabled { background:#262b35 !important; }
            /* 浅色渐变横幅（生日提醒）→ 纯深色 */
            .from-pink-50 { background-image:none !important; background-color:#3a1d28 !important; }
            .bg-white\/70 { background:rgba(40,45,58,.7) !important; }

            /* hover/active 浅色底统一深色 */
            .hover\:bg-indigo-50:hover, .active\:bg-indigo-50:active, .active\:bg-indigo-100:active { background:#242a52 !important; }
            .hover\:bg-gray-50:hover, .active\:bg-gray-50:active, .active\:bg-gray-100:active { background:#262b36 !important; }
            .hover\:bg-purple-50:hover, .active\:bg-purple-50:active, .active\:bg-purple-100:active { background:#33244f !important; }
            .active\:bg-green-50:active, .active\:bg-green-100:active { background:#1d3f29 !important; }
            .active\:bg-emerald-100:active { background:#1c3f30 !important; }
            .active\:bg-amber-50:active, .active\:bg-amber-100:active, .active\:bg-amber-200:active { background:#463a1f !important; }
            .active\:bg-orange-100:active { background:#4a3418 !important; }
            .active\:bg-red-50:active, .active\:bg-red-100:active { background:#4a262c !important; }
            .active\:bg-pink-50:active, .active\:bg-pink-100:active { background:#4a2438 !important; }

            /* 彩色浅底 → 深色同色调，文字提亮 */
            .bg-indigo-50  { background:#1e2140 !important; }
            .bg-indigo-100 { background:#2a2e58 !important; }
            .bg-pink-50    { background:#3a1d2e !important; }
            .bg-pink-100   { background:#4a2438 !important; }
            .bg-rose-50    { background:#3a1d28 !important; }
            .bg-red-50     { background:#3a1f24 !important; }
            .bg-red-100    { background:#4a262c !important; }
            .bg-orange-50  { background:#3a2a1c !important; }
            .bg-amber-50   { background:#382e18 !important; }
            .bg-amber-100  { background:#463a1f !important; }
            .bg-yellow-50  { background:#38341a !important; }
            .bg-green-50   { background:#16301f !important; }
            .bg-green-100  { background:#1d3f29 !important; }
            .bg-emerald-50 { background:#1a2320 !important; }
            .bg-emerald-100{ background:#1c3f30 !important; }
            .bg-blue-50    { background:#182a44 !important; }
            .bg-blue-100   { background:#20375a !important; }
            .bg-purple-50  { background:#2a1d40 !important; }
            .bg-purple-100 { background:#382a55 !important; }
            .bg-teal-50    { background:#153030 !important; }
            /* 彩色文字提亮 */
            .text-indigo-900, .text-indigo-800, .text-indigo-700 { color:#a9b4ff !important; }
            .text-indigo-600, .text-indigo-500, .text-indigo-400 { color:#8b97f0 !important; }
            .text-pink-700, .text-pink-600, .text-pink-500, .text-pink-400 { color:#f7a8c8 !important; }
            .text-rose-700, .text-rose-600, .text-rose-500, .text-rose-400 { color:#f7a3ba !important; }
            .text-red-700, .text-red-600, .text-red-500 { color:#f6a5ad !important; }
            .text-orange-700, .text-orange-600, .text-orange-500 { color:#f4b483 !important; }
            .text-amber-800, .text-amber-700, .text-amber-600, .text-amber-500 { color:#efc471 !important; }
            .text-green-700, .text-green-600, .text-green-500 { color:#8fdca0 !important; }
            .text-emerald-800, .text-emerald-700, .text-emerald-600 { color:#8ad9b4 !important; }
            .text-blue-800, .text-blue-700, .text-blue-600, .text-blue-500 { color:#8fb8f0 !important; }
            .text-purple-800, .text-purple-700, .text-purple-600 { color:#c3a5f2 !important; }
            /* 彩色边框调暗（含本 fork 特有的 -100 变体） */
            .border-indigo-100,.border-indigo-200,.border-indigo-300 { border-color:#33386a !important; }
            .border-pink-100,.border-pink-200 { border-color:#5a2f42 !important; }
            .border-amber-200,.border-amber-300 { border-color:#544418 !important; }
            .border-green-200 { border-color:#274d34 !important; }
            .border-red-100,.border-red-200 { border-color:#5a2f36 !important; }
            .border-orange-100 { border-color:#54401f !important; }
            .border-emerald-100,.border-emerald-200 { border-color:#245040 !important; }
            .border-blue-100 { border-color:#28406a !important; }

        }

        /* ── Fix #6: touch-action on all interactive elements ── */
        button, a, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* ── Animations ── */
        .sp { border:3px solid rgba(255,255,255,.3); border-radius:50%; border-top:3px solid #fff; width:16px; height:16px; animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .anim { animation: fi .2s ease-out; }
        @keyframes fi { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .toast { animation: ti .2s ease, to_ .3s ease 2.4s forwards; }
        @keyframes ti   { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes to_  { from{opacity:1} to{opacity:0} }

        /* ── Scrollbar ── */
        .sl::-webkit-scrollbar { width:4px; }
        .sl::-webkit-scrollbar-thumb { background:#c7d2fe; border-radius:2px; }

        /* ── PIN ── */
        .pin-dot { width:14px; height:14px; border-radius:50%; background:#e5e7eb; transition:background .12s; }
        .pin-dot.on { background:#6366f1; }
        /* Fix ⑦: override global 16px rule with !important so PIN digits stay large */
        .pin-input { width:56px; height:68px; font-size:28px !important; text-align:center; border:2px solid #e5e7eb; border-radius:14px; outline:none; transition:border-color .15s; background:transparent; }
        .pin-input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }

        /* ── Fix #7: safe modal scrolling on iPad ── */
        .modal-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

        /* ── Mobile layout: accounts for top bar + bottom nav + iOS safe areas ── */
        .toast-bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
        @media (max-width: 767px) {
            .mobile-top-bar { height: calc(56px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
            .mobile-main-top { padding-top: calc(58px + env(safe-area-inset-top, 0px)) !important; }
            .mobile-pb { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)) !important; }
            .toast-bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); }
        }

        /* ── Touch-friendly table rows ── */
        @media (hover:none) { .hover-row:active { background:#f9fafb; } }

        /* ── B1: Portfolio thumbnail actions — always visible on touch screens ── */
        @media (hover:none) { .port-actions { display:flex !important; } }
        :root {
            --tenant-primary:#312e81;
            --tenant-primary-soft:#eef2ff;
            --tenant-primary-border:#c7d2fe;
            --tenant-secondary:#6366f1;
            --tenant-secondary-soft:#f5f3ff;
            --tenant-secondary-border:#ddd6fe;
            --surface:#ffffff;
            --ink:#0f172a;
            --muted:#64748b;
            --line:#e2e8f0;
            --shadow-sm:0 1px 2px rgba(0,0,0,.04);
            --shadow-md:0 4px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
            --shadow-lg:0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
            --radius:8px;
            --radius-xl:16px;
        }
        /* Was `background:#f1f5f9 !important` — Tailwind slate-100, a cold blue
           grey that outranked every tenant theme. The CMS looked identical for
           all eight palettes. --bg is set by the theme map above and falls back
           to the old value only until /brand answers. */
        body { background:var(--bg, #f1f5f9); color:var(--ink); -webkit-font-smoothing:antialiased; }
        .shadow-sm { box-shadow:var(--shadow-sm) !important; }
        .shadow-md { box-shadow:var(--shadow-md) !important; }
        .shadow-2xl { box-shadow:var(--shadow-lg) !important; }
        .rounded-xl { border-radius:var(--radius) !important; }
        .rounded-2xl, .rounded-3xl { border-radius:var(--radius-xl) !important; }
        input, textarea, select {
            background:var(--surface) !important;
            border-color:var(--line) !important;
            border-radius:var(--radius) !important;
            color:var(--ink);
            transition:border-color .15s ease, box-shadow .15s ease;
        }
        input:focus, textarea:focus, select:focus {
            border-color:var(--tenant-primary) !important;
            box-shadow:0 0 0 3px var(--tenant-primary-soft) !important;
        }
        button, a, [role="button"] {
            border-radius:var(--radius) !important;
            transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease;
        }
        button, [role="button"] { min-height:44px; }
        button:hover, a:hover, [role="button"]:hover { transform:translateY(-1px); box-shadow:var(--shadow-sm); }
        button:disabled { opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
        .toast { box-shadow:var(--shadow-lg) !important; border-radius:var(--radius-xl) !important; }
        .pin-input { border-radius:var(--radius) !important; }
        [class*="bg-indigo-600"], [class*="bg-indigo-700"], .tab-active { background-color:var(--tenant-primary) !important; }
        [class*="bg-indigo-50"], [class*="bg-indigo-100"] { background-color:var(--tenant-primary-soft) !important; }
        [class*="text-indigo-400"], [class*="text-indigo-500"], [class*="text-indigo-600"], [class*="text-indigo-700"], [class*="text-indigo-800"] { color:var(--tenant-primary) !important; }
        [class*="border-indigo-"] { border-color:var(--tenant-primary-border) !important; }
        [class*="from-indigo-"] { --tw-gradient-from:var(--tenant-primary) var(--tw-gradient-from-position) !important; --tw-gradient-to:rgb(255 255 255 / 0) var(--tw-gradient-to-position) !important; --tw-gradient-stops:var(--tw-gradient-from), var(--tw-gradient-to) !important; }
        [class*="to-indigo-"], [class*="to-purple-"] { --tw-gradient-to:var(--tenant-secondary) var(--tw-gradient-to-position) !important; }
        [class*="bg-purple-600"], [class*="bg-purple-700"] { background-color:var(--tenant-secondary) !important; }
        [class*="bg-purple-50"], [class*="bg-purple-100"] { background-color:var(--tenant-secondary-soft) !important; }
        [class*="text-purple-400"], [class*="text-purple-500"], [class*="text-purple-600"], [class*="text-purple-700"], [class*="text-purple-800"] { color:var(--tenant-secondary) !important; }
        [class*="border-purple-"] { border-color:var(--tenant-secondary-border) !important; }

        /* ── Dark chrome: the sidebar, the mobile top bar and the login panel ──
           The rules above only ever covered the 50/100/600/700 shades. The
           sidebar is `bg-indigo-900 text-white`, the login panel is a
           `from-indigo-900 to-indigo-950` gradient, and the status pills inside
           the sidebar are `bg-indigo-950` — none of which were mapped. So a
           studio that picked the clay palette got a clay content area beside a
           slab of Tailwind indigo, which reads worse than the fully unthemed
           CMS did.

           These map to --ink (the theme's text colour used as a surface) with
           --bg as the foreground. That is the same inversion the portal's
           success card uses, and palette_gen.py:221 asserts the pair at 4.5:1
           for all 15 theme-modes — so it stays readable whether the tenant
           theme is light or dark, which a fixed `text-white` cannot. */
        [class*="bg-indigo-800"], [class*="bg-indigo-900"] { background-color:var(--ink) !important; }
        /* One step toward the page colour, so nested pills read as inset in
           either direction rather than assuming "darker" means "deeper". */
        [class*="bg-indigo-950"] { background-color:color-mix(in srgb, var(--ink) 86%, var(--bg)) !important; }

        [class*="bg-indigo-800"], [class*="bg-indigo-900"], [class*="bg-indigo-950"],
        [class*="bg-indigo-800"] .text-white, [class*="bg-indigo-900"] .text-white, [class*="bg-indigo-950"] .text-white,
        [class*="from-indigo-9"] .text-white, [class*="from-indigo-9"] h1, [class*="from-indigo-9"] h2 { color:var(--bg) !important; }

        /* Muted sidebar copy: legible against --ink without competing with the
           primary labels. */
        [class*="text-indigo-100"], [class*="text-indigo-200"], [class*="text-indigo-300"] { color:color-mix(in srgb, var(--bg) 74%, var(--ink)) !important; }
        [class*="border-indigo-800"], [class*="border-indigo-900"] { border-color:color-mix(in srgb, var(--bg) 24%, var(--ink)) !important; }

        /* The unauthenticated login backdrop. */
        [class*="from-indigo-9"] { --tw-gradient-from:var(--ink) var(--tw-gradient-from-position) !important; }
        [class*="to-indigo-95"] { --tw-gradient-to:color-mix(in srgb, var(--ink) 86%, var(--bg)) var(--tw-gradient-to-position) !important; }

        /* ══ Tenant theme takes over every Tailwind colour the CMS uses ══
           Audited 2026-07-30: cms-app.jsx carries 1,389 colour utilities across
           12 families. Only indigo and purple were ever re-pointed, so a studio
           that picked the clay palette still saw a green "网站与品牌" button, a
           blue "长期未到访" panel, green row actions and pink birthday chips —
           the CMS looked like four products stacked together.

           The mapping is by ROLE, not by hue, because that is what survives a
           theme switch: red/rose mean danger whatever the palette, gray means
           "structure", and the tenant's own success/warning/danger already
           carry generator-checked contrast (palette_gen.py asserts each against
           both page and panel). Mapping hue-to-hue would just move the problem.

           Soft fills go through color-mix against --panel rather than a fixed
           tint, so they stay light under a light theme and dark under a dark one
           instead of becoming a pale slab on a dark page. */

        /* — structure: gray/slate/zinc/neutral/stone — */
        [class*="bg-gray-50"], [class*="bg-slate-50"], [class*="bg-zinc-50"], [class*="bg-neutral-50"], [class*="bg-stone-50"],
        [class*="bg-gray-100"], [class*="bg-slate-100"], [class*="bg-zinc-100"] { background-color:var(--bg2) !important; }
        [class*="bg-gray-200"], [class*="bg-slate-200"], [class*="bg-gray-300"] { background-color:color-mix(in srgb, var(--line) 70%, var(--panel)) !important; }
        [class*="text-gray-400"], [class*="text-slate-400"], [class*="text-gray-500"], [class*="text-slate-500"],
        [class*="text-zinc-400"], [class*="text-neutral-400"] { color:var(--muted) !important; }
        [class*="text-gray-600"], [class*="text-slate-600"], [class*="text-gray-700"], [class*="text-slate-700"] { color:var(--ink2) !important; }
        [class*="text-gray-800"], [class*="text-slate-800"], [class*="text-gray-900"], [class*="text-slate-900"] { color:var(--ink) !important; }
        [class*="border-gray-"], [class*="border-slate-"], [class*="border-zinc-"], [class*="border-neutral-"], [class*="border-stone-"] { border-color:var(--line) !important; }
        [class*="divide-gray-"], [class*="divide-slate-"] { border-color:var(--line) !important; }

        /* — success: green / emerald / teal / lime — */
        [class*="bg-green-50"], [class*="bg-green-100"], [class*="bg-emerald-50"], [class*="bg-emerald-100"],
        [class*="bg-teal-50"], [class*="bg-teal-100"], [class*="bg-lime-50"], [class*="bg-lime-100"] { background-color:color-mix(in srgb, var(--success) 12%, var(--panel)) !important; }
        [class*="bg-green-6"], [class*="bg-green-7"], [class*="bg-emerald-6"], [class*="bg-emerald-7"],
        [class*="bg-teal-6"], [class*="bg-teal-7"] { background-color:var(--success) !important; color:var(--on-accent) !important; }
        [class*="text-green-"], [class*="text-emerald-"], [class*="text-teal-"], [class*="text-lime-"] { color:var(--success) !important; }
        [class*="border-green-"], [class*="border-emerald-"], [class*="border-teal-"], [class*="border-lime-"] { border-color:color-mix(in srgb, var(--success) 45%, var(--panel)) !important; }

        /* — warning: amber / yellow / orange — */
        [class*="bg-amber-50"], [class*="bg-amber-100"], [class*="bg-yellow-50"], [class*="bg-yellow-100"],
        [class*="bg-orange-50"], [class*="bg-orange-100"] { background-color:color-mix(in srgb, var(--warning) 14%, var(--panel)) !important; }
        [class*="bg-amber-6"], [class*="bg-amber-7"], [class*="bg-orange-6"], [class*="bg-orange-7"] { background-color:var(--warning) !important; color:var(--on-accent) !important; }
        [class*="text-amber-"], [class*="text-yellow-"], [class*="text-orange-"] { color:var(--warning) !important; }
        [class*="border-amber-"], [class*="border-yellow-"], [class*="border-orange-"] { border-color:color-mix(in srgb, var(--warning) 45%, var(--panel)) !important; }

        /* — danger: red / rose — */
        [class*="bg-red-50"], [class*="bg-red-100"], [class*="bg-rose-50"], [class*="bg-rose-100"] { background-color:color-mix(in srgb, var(--danger) 12%, var(--panel)) !important; }
        [class*="bg-red-6"], [class*="bg-red-7"], [class*="bg-rose-6"], [class*="bg-rose-7"] { background-color:var(--danger) !important; color:var(--on-accent) !important; }
        [class*="text-red-"], [class*="text-rose-"] { color:var(--danger) !important; }
        [class*="border-red-"], [class*="border-rose-"] { border-color:color-mix(in srgb, var(--danger) 45%, var(--panel)) !important; }

        /* — informational: blue / sky / cyan / pink / fuchsia —
           These carry no semantic weight of their own in this app (the blue
           "long absence" panel, the pink birthday chips), so they follow the
           tenant's secondary accent and stay distinct from the primary. */
        [class*="bg-blue-50"], [class*="bg-blue-100"], [class*="bg-sky-50"], [class*="bg-sky-100"],
        [class*="bg-cyan-50"], [class*="bg-pink-50"], [class*="bg-pink-100"], [class*="bg-fuchsia-50"] { background-color:color-mix(in srgb, var(--accent-dark) 12%, var(--panel)) !important; }
        [class*="bg-blue-6"], [class*="bg-blue-7"], [class*="bg-sky-6"], [class*="bg-pink-6"], [class*="bg-pink-7"] { background-color:var(--accent-dark) !important; color:var(--on-secondary) !important; }
        [class*="text-blue-"], [class*="text-sky-"], [class*="text-cyan-"], [class*="text-pink-"], [class*="text-fuchsia-"] { color:var(--accent-dark) !important; }
        [class*="border-blue-"], [class*="border-sky-"], [class*="border-cyan-"], [class*="border-pink-"], [class*="border-fuchsia-"] { border-color:color-mix(in srgb, var(--accent-dark) 45%, var(--panel)) !important; }

        /* The tail of the audit: shades used only once or twice, which is exactly
           how a palette leaks back in — nobody notices a single bg-amber-400. */
        [class*="bg-gray-700"], [class*="bg-gray-800"], [class*="bg-gray-900"] { background-color:var(--ink) !important; color:var(--bg) !important; }
        [class*="text-gray-300"] { color:color-mix(in srgb, var(--muted) 70%, var(--panel)) !important; }
        [class*="text-indigo-900"] { color:var(--accent) !important; }
        [class*="text-purple-900"] { color:var(--accent-dark) !important; }
        [class*="bg-amber-200"], [class*="bg-amber-400"] { background-color:color-mix(in srgb, var(--warning) 55%, var(--panel)) !important; }
        [class*="bg-green-400"] { background-color:color-mix(in srgb, var(--success) 60%, var(--panel)) !important; }
        [class*="bg-red-900"] { background-color:var(--danger) !important; color:var(--on-accent) !important; }
        [class*="bg-blue-200"] { background-color:color-mix(in srgb, var(--accent-dark) 30%, var(--panel)) !important; }

        /* Decorative gradients (avatar placeholders, celebration banners).
           Both stops follow the theme so a gradient cannot smuggle an
           off-palette hue past the rules above. */
        [class*="from-purple-"], [class*="from-pink-"], [class*="from-rose-"],
        [class*="from-blue-"], [class*="from-emerald-"], [class*="from-amber-"] { --tw-gradient-from:var(--accent) var(--tw-gradient-from-position) !important; }
        [class*="to-pink-"], [class*="to-rose-"], [class*="to-purple-"],
        [class*="to-blue-"], [class*="to-emerald-"], [class*="to-amber-"] { --tw-gradient-to:var(--accent-dark) var(--tw-gradient-to-position) !important; }

        /* The shared admin language switch reads --brand, which the CMS never
           defined, so it fell back to the stock blue #3b82f6 in the corner of
           an otherwise themed page. */
        :root { --brand:var(--accent); }

        /* ── M6: Thumbnail active feedback on touch ── */
        .port-thumb { touch-action:manipulation; }
        .port-thumb:active { opacity:.82; transform:scale(.96); transition:opacity .08s,transform .08s; }
        /* ── M7: Image loading skeleton ── */
        .img-skel { background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%); background-size:200% 100%; animation:skel-shine 1.4s infinite; }
        @keyframes skel-shine { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ── A11y: respect prefers-reduced-motion (2026-07 UI audit) ──
           Entry/exit and shimmer animations are decorative; users who ask the
           OS for less motion get instant state changes instead. The .sp
           loading spinner is kept (it conveys "busy"), everything else stops. */
        @media (prefers-reduced-motion: reduce) {
            .anim, .toast, .img-skel { animation: none !important; }
            *, *::before, *::after { transition-duration: .01ms !important; }
            html { scroll-behavior: auto !important; }
            button:hover, a:hover, [role="button"]:hover { transform: none !important; }
            .port-thumb:active { transform: none !important; }
        }

        /* ── Print styles (export feature) ── */
        @media print {
            aside, .no-print { display:none !important; }
            main { padding:0 !important; overflow:visible !important; }
            body { background:white !important; }
            .print-card { break-inside:avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
<div id="root"></div>
<script src="/assets/cms-app.js"></script>
<!-- Loaded after the app so the observer starts on a rendered tree. Shares the
     language choice with Studio Admin / Super Admin via admin-i18n's key. -->
<script src="/assets/cms-i18n.js"></script>
</body>
</html>
