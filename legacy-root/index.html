<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Studio CMS</title>
    <script src="/assets/ui-common.js?v=__APP_VERSION__"></script>
    <link rel="stylesheet" href="/assets/ui-tokens.css?v=__APP_VERSION__">
    <link rel="stylesheet" href="/assets/brand-system.css?v=__APP_VERSION__">
    <link rel="icon" href="/icon-192.png">
    <!-- G6: PWA — 添加到主屏幕 -->
    <link id="cmsManifest" rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0e1729">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Studio CMS">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      /* S1 (v6.6.5): register the SW scoped to this tenant page only, and
       * unregister historical root-scope registrations so the SW never
       * intercepts other surfaces. */
      if ('serviceWorker' in navigator)
        window.addEventListener('load', () => {
          const match = location.pathname.match(/^\/([^/]+)\/cms\/?$/);
          const scope = match ? `/${match[1]}/` : '/';
          const cleanup = scope === '/' ? Promise.resolve() :
            navigator.serviceWorker.getRegistrations().then((regs) =>
              Promise.all(regs.filter((r) => new URL(r.scope).pathname === '/').map((r) => r.unregister()))
            ).catch(() => {});
          Promise.resolve(cleanup).then(() =>
            navigator.serviceWorker.register('/sw.js', { scope }).catch(() => {}));
        });
    </script>
    <script>
      (() => {
        const fromPath = location.pathname.match(/^\/([^/]+)(?:\/cms)?\/?$/);
        const tenantSlug = new URLSearchParams(location.search).get('tenant') || (fromPath && fromPath[1]) || '';
        if (!tenantSlug) return;
        window.STUDIOSAAS_TENANT_SLUG = tenantSlug;
        const setTenantTheme = (brand) => {
          if (!brand) return;
          const root = document.documentElement;
          const visual = brand.visual_theme || brand.visualTheme || {};
          const primary = visual.accent_color || visual.accentColor || brand.primary_color || brand.primaryColor || '#0e1729';
	          const secondary = visual.secondary_accent_color || visual.secondaryAccentColor || brand.secondary_color || brand.secondaryColor || '#16233d';
	          const rawLogo = brand.logo_url || brand.logoUrl || '';
	          const logo = ['/logo.png', '/logo-light.png', '/favicon.svg'].includes(rawLogo) ? '' : rawLogo;
	          const slogan = brand.slogan || 'Learn, grow, and feel confident.';
	          root.style.setProperty('--tenant-primary', primary);
          root.style.setProperty('--brand-accent', primary);
          root.style.setProperty('--tenant-primary-soft', `${primary}14`);
          root.style.setProperty('--tenant-primary-border', `${primary}40`);
          root.style.setProperty('--tenant-secondary', secondary);
          root.style.setProperty('--brand-accent-strong', secondary);
          /* The same declarative map the portal and register page use
             (tenant-template/register.html:364), so the three tenant surfaces
             can never apply a different subset of a theme again. This used to
             carry 10 of the 21 tokens: border_strong_color, the accent
             hover/pressed states, focus_ring_color, the disabled pair and the
             scrim were all missing, so a studio that picked one of the eight
             palettes got a CMS that was only partly theirs. */
          const themeVars = {
            background_color:       ['--bg', '--brand-paper'],
            background_alt_color:   ['--bg2'],
            panel_color:            ['--panel', '--surface', '--brand-paper-raised'],
            text_color:             ['--ink', '--brand-ink'],
            text_soft_color:        ['--ink2'],
            muted_text_color:       ['--muted', '--brand-ink-soft'],
            border_color:           ['--line', '--brand-line'],
            border_strong_color:    ['--line-strong'],
            accent_color:           ['--accent', '--brand-accent'],
            accent_hover_color:     ['--accent-hover'],
            accent_pressed_color:   ['--accent-pressed'],
            accent_text_color:      ['--on-accent', '--brand-on-accent'],
            secondary_accent_color: ['--accent-dark', '--brand-accent-strong'],
            secondary_text_color:   ['--on-secondary', '--brand-on-secondary'],
            success_color:          ['--success', '--brand-success'],
            warning_color:          ['--warning', '--brand-warning'],
            danger_color:           ['--danger', '--brand-danger'],
            focus_ring_color:       ['--focus-ring'],
            disabled_surface_color: ['--disabled-surface'],
            disabled_text_color:    ['--disabled-text'],
            scrim_color:            ['--scrim']
          };
          Object.entries(themeVars).forEach(([key, cssVars]) => {
            const camel = key.replace(/_([a-z])/g, (_, char) => char.toUpperCase());
            const value = visual[key] || visual[camel];
            if (value) cssVars.forEach((cssVar) => root.style.setProperty(cssVar, value));
          });
          root.dataset.brandScheme = visual.color_scheme || visual.colorScheme || 'light';
          root.style.setProperty('--tenant-secondary-soft', `${secondary}14`);
          root.style.setProperty('--tenant-secondary-border', `${secondary}40`);
		          if (brand.name) document.title = `${brand.name} CMS`;
		          document.querySelectorAll('.tenant-slogan').forEach((el) => {
		            el.textContent = slogan;
		          });
                  window.dispatchEvent(new CustomEvent('studiosaas:brand', {detail: brand}));
        };
        const scheduleTenantTheme = () => {
          setTenantTheme(window.STUDIOSAAS_BRAND);
          setTimeout(() => setTenantTheme(window.STUDIOSAAS_BRAND), 300);
          setTimeout(() => setTenantTheme(window.STUDIOSAAS_BRAND), 1200);
          setTimeout(() => setTenantTheme(window.STUDIOSAAS_BRAND), 3000);
        };
        window.STUDIOSAAS_REGISTER_URL = `${location.origin}/${tenantSlug}/register`;
        const manifestLink = document.getElementById('cmsManifest');
        if (manifestLink) manifestLink.href = `/${encodeURIComponent(tenantSlug)}/manifest-cms.json`;
        window.STUDIOSAAS_TENANT_SLUG = tenantSlug;
        window.STUDIOSAAS_APPLY_BRAND = setTenantTheme;
        window.addEventListener('load', scheduleTenantTheme);
        const originalFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const raw = typeof input === 'string' ? input : (input && input.url) || '';
          const url = new URL(raw, location.origin);
          let next = input;
          if (url.origin === location.origin && url.pathname === '/api/data') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/data`;
          } else if (url.origin === location.origin && url.pathname === '/api/save') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/save`;
          } else if (url.origin === location.origin && url.pathname === '/api/upload') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/media/upload`;
          } else if (url.origin === location.origin && url.pathname === '/api/portfolio/upload') {
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/portfolio/upload`;
          } else if (url.origin === location.origin && url.pathname.startsWith('/api/portfolio/') && url.pathname !== '/api/portfolio/token') {
            const rest = url.pathname.slice('/api/portfolio/'.length);
            next = `/s/${encodeURIComponent(tenantSlug)}/v1/legacy-cms/portfolio/${rest}${url.search}`;
          }
          return originalFetch(next, init);
        };
        originalFetch(`/v1/public/${encodeURIComponent(tenantSlug)}/brand`)
          .then((res) => res.ok ? res.json() : null)
          .then((data) => {
            const brand = data && data.brand;
            window.STUDIOSAAS_BRAND = brand;
            scheduleTenantTheme();
          })
          .catch(() => {});
      })();
    </script>
    <!-- Pinned local vendor scripts: public pilot pages never execute third-party CDN fallbacks. -->
    <script src="/vendor/tailwindcss.js"></script>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <!-- A3: JSX is precompiled at build time (backend/scripts/build_cms.sh); no in-browser Babel. -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        /* ── Fix #4: prevent iOS auto-zoom on inputs (requires font-size ≥ 16px) ── */
        input, textarea, select { font-size: 16px !important; }

        /* v8.0.1 golden-ratio dashboard hierarchy. Data tables stay dense;
           only the decision-oriented dashboard lead uses a 61.8/38.2 split. */
        .cms-dashboard-root {
            width: 100%;
            max-width: var(--ui-content-max, 89rem);
            margin-inline: auto;
        }
        .cms-dashboard-lead {
            display: grid;
            gap: var(--ui-space-4, 21px);
        }
        .cms-kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--ui-space-3, 13px);
            align-content: start;
        }
        .cms-command-card { min-width: 0; }
        @media (min-width: 1024px) {
            .cms-dashboard-lead {
                grid-template-columns: var(--ui-golden-columns, minmax(0, 1.618fr) minmax(0, 1fr));
                align-items: start;
            }
        }
        @media (max-width: 639px) {
            .cms-kpi-grid { gap: var(--ui-space-2, 8px); }
        }

        /* ── Student profile sheet: identity / tabs / panel / actions ──
           Every number here comes from the φ ladder already declared in
           assets/ui-tokens.css (5 · 8 · 13 · 21 · 34 · 55 · 89, each step
           ≈1.618x the last), so the sheet is measured against the same scale
           as the dashboard rather than against a second set of round numbers.

             width      34rem  (544px) — the ladder's 34 step
             height cap 89dvh          — the 89 step, and the last stop before
                                         a sheet stops reading as a sheet
             panel pad  21px           — --ui-space-4
             row gap    13px           — --ui-space-3, one step down, so the
                                         gap between rows is visibly subordinate
                                         to the padding around them
             actions    1.618fr : 1fr  — the primary action takes the golden
                                         major share, the secondary the minor */
        .cms-profile-sheet {
            max-height: 89dvh;
        }
        @media (min-width: 640px) {
            .cms-profile-sheet { max-width: 34rem; }
        }
        .cms-profile-body {
            padding: var(--ui-space-4, 21px);
        }
        .cms-profile-actions {
            display: grid;
            gap: var(--ui-space-2, 8px);
            padding: var(--ui-space-3, 13px) var(--ui-space-4, 21px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--ui-space-3, 13px));
        }
        .cms-profile-actions-row {
            display: grid;
            gap: var(--ui-space-2, 8px);
            grid-template-columns: var(--ui-golden-columns, minmax(0, 1.618fr) minmax(0, 1fr));
        }
        /* One action present: it takes the whole row rather than leaving a
           38.2% hole where the other button would have been. */
        .cms-profile-actions-row > :only-child { grid-column: 1 / -1; }


        /* One dark-mode owner: before /brand answers, OS preference provides a
           neutral token fallback; afterwards data-brand-scheme and the tenant
           palette own every surface. Utility-specific dark overrides used to
           fight the tenant role map and could produce dark pages with light
           tenant text. */
        @media (prefers-color-scheme: dark) {
            html:not([data-brand-scheme]) {
                color-scheme:dark;
                --bg:#0e1016;
                --bg2:#20242f;
                --panel:#1a1d27;
                --surface:#1a1d27;
                --ink:#e8eaf0;
                --ink2:#c3c8d4;
                --muted:#9ca3b3;
                --line:#2c313d;
                --line-strong:#454c5c;
            }
        }
        html[data-brand-scheme="dark"] { color-scheme:dark; }
        html[data-brand-scheme="light"] { color-scheme:light; }

        /* ── Fix #6: touch-action on all interactive elements ── */
        button, a, summary, label, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* ── Animations ── */
        .sp { border:3px solid rgba(255,255,255,.3); border-radius:50%; border-top:3px solid #fff; width:16px; height:16px; animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .anim { animation: fi .2s ease-out; }
        @keyframes fi { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .toast { animation: ti .2s ease, to_ .3s ease 2.4s forwards; }
        @keyframes ti   { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes to_  { from{opacity:1} to{opacity:0} }

        /* ── Scrollbar ── */
        .sl::-webkit-scrollbar { width:4px; }
        .sl::-webkit-scrollbar-thumb { background:#c7d2fe; border-radius:2px; }

        /* ── Fix #7: safe modal scrolling on iPad ── */
        .modal-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

        /* ── Mobile layout: accounts for top bar + bottom nav + iOS safe areas ── */
        .toast-bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
        @media (max-width: 767px) {
            .mobile-top-bar { height: calc(56px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
            .mobile-main-top { padding-top: calc(58px + env(safe-area-inset-top, 0px)) !important; }
            .mobile-pb { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)) !important; }
            .toast-bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); }
        }

        /* ── Touch-friendly table rows ── */
        @media (hover:none) { .hover-row:active { background:#f9fafb; } }

        /* ── B1: Portfolio thumbnail actions — always visible on touch screens ── */
        @media (hover:none) { .port-actions { display:flex !important; } }
        :root {
            --tenant-primary:#0e1729;
            --tenant-primary-soft:#eef2ff;
            --tenant-primary-border:#c7d2fe;
            --tenant-secondary:#16233d;
            --tenant-secondary-soft:#f5f3ff;
            --tenant-secondary-border:#ddd6fe;
            --surface:#ffffff;
            --ink:#0f172a;
            --muted:#64748b;
            --line:#e2e8f0;
            --shadow-sm:0 1px 2px rgba(0,0,0,.04);
            --shadow-md:0 4px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
            --shadow-lg:0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
            --radius:var(--ui-radius-control, 8px);
            --radius-xl:var(--ui-radius-sheet, 21px);
        }
        /* Was `background:#f1f5f9 !important` — Tailwind slate-100, a cold blue
           grey that outranked every tenant theme. The CMS looked identical for
           all eight palettes. --bg is set by the theme map above and falls back
           to the old value only until /brand answers. */
        body { background:var(--bg, #f1f5f9); color:var(--ink); -webkit-font-smoothing:antialiased; }
        .shadow-sm { box-shadow:var(--shadow-sm) !important; }
        .shadow-md { box-shadow:var(--shadow-md) !important; }
        .shadow-2xl { box-shadow:var(--shadow-lg) !important; }
        .rounded-xl { border-radius:var(--radius) !important; }
        .rounded-2xl, .rounded-3xl { border-radius:var(--radius-xl) !important; }
        input, textarea, select {
            background:var(--surface) !important;
            border-color:var(--line) !important;
            border-radius:var(--radius) !important;
            color:var(--ink);
            transition:border-color .15s ease, box-shadow .15s ease;
        }
        input:not([type="checkbox"]):not([type="radio"]), select { min-height:var(--ui-touch-target, 44px); }
        input:focus, textarea:focus, select:focus {
            border-color:var(--tenant-primary) !important;
            box-shadow:0 0 0 3px var(--tenant-primary-soft) !important;
        }
        button, a, [role="button"] {
            border-radius:var(--radius) !important;
            transition:transform var(--ui-duration-exit, 144ms) ease, box-shadow var(--ui-duration-exit, 144ms) ease, background-color var(--ui-duration-exit, 144ms) ease;
        }
        button, [role="button"], a[class*="rounded"] { min-height:var(--ui-touch-target, 44px); }
        button[aria-label], [role="button"][aria-label], a[aria-label] { min-width:var(--ui-touch-target, 44px); }
        @media (hover:hover) {
            button:hover, a:hover, [role="button"]:hover { transform:translateY(-1px); box-shadow:var(--shadow-sm); }
            nav a:hover, table a:hover, .hover-row:hover, .hover-row a:hover { transform:none; }
        }
        button:active, a[class*="rounded"]:active, [role="button"]:active { transform:scale(.985); }
        button:disabled { opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
        [class*="bg-black/40"], [class*="bg-black/50"], [class*="bg-black/60"], [class*="bg-black/70"] {
            background-color:var(--scrim, var(--ui-scrim, rgba(15,23,42,.60))) !important;
        }
        .toast { box-shadow:var(--shadow-lg) !important; border-radius:var(--radius-xl) !important; }
        /* A themed surface has to carry its own foreground. `text-white` is not
           a token: once --tenant-primary followed a dark theme's bright accent,
           a white label on it measured 2.08:1 (studio-ink dark). --on-accent is
           the pair palette_gen asserts at 4.6:1; measured worst 5.83:1. */
        [class*="bg-indigo-600"], [class*="bg-indigo-700"], .tab-active { background-color:var(--tenant-primary) !important; color:var(--on-accent) !important; }
        /* Soft accent fill mixed against the panel rather than an 8%-alpha hex,
           so the value is deterministic and can be measured. At 10% the three
           foregrounds it hosts measure accent 5.00 / --ink 11.14 / --muted 4.68
           at their worst across the 15 theme-modes; at the previous 12% --muted
           dropped to 4.48 and missed AA. */
        [class*="bg-indigo-50"], [class*="bg-indigo-100"] { background-color:color-mix(in srgb, var(--accent) 10%, var(--panel)) !important; }
        [class*="text-indigo-400"], [class*="text-indigo-500"], [class*="text-indigo-600"], [class*="text-indigo-700"], [class*="text-indigo-800"] { color:var(--tenant-primary) !important; }
        [class*="border-indigo-"] { border-color:var(--tenant-primary-border) !important; }
        [class*="from-indigo-"] { --tw-gradient-from:var(--tenant-primary) var(--tw-gradient-from-position) !important; --tw-gradient-to:rgb(255 255 255 / 0) var(--tw-gradient-to-position) !important; --tw-gradient-stops:var(--tw-gradient-from), var(--tw-gradient-to) !important; }
        [class*="to-indigo-"], [class*="to-purple-"] { --tw-gradient-to:var(--tenant-secondary) var(--tw-gradient-to-position) !important; }
        [class*="bg-purple-600"], [class*="bg-purple-700"] { background-color:var(--tenant-secondary) !important; color:var(--on-secondary) !important; }
        [class*="bg-purple-50"], [class*="bg-purple-100"] { background-color:color-mix(in srgb, var(--accent-dark) 10%, var(--panel)) !important; }
        [class*="text-purple-400"], [class*="text-purple-500"], [class*="text-purple-600"], [class*="text-purple-700"], [class*="text-purple-800"] { color:var(--tenant-secondary) !important; }
        [class*="border-purple-"] { border-color:var(--tenant-secondary-border) !important; }

        /* ── Dark chrome: the sidebar, the mobile top bar and the login panel ──
           The rules above only ever covered the 50/100/600/700 shades. The
           sidebar is `bg-indigo-900 text-white`, the login panel is a
           `from-indigo-900 to-indigo-950` gradient, and the status pills inside
           the sidebar are `bg-indigo-950` — none of which were mapped. So a
           studio that picked the clay palette got a clay content area beside a
           slab of Tailwind indigo, which reads worse than the fully unthemed
           CMS did.

           These map to --ink (the theme's text colour used as a surface) with
           --bg as the foreground. That is the same inversion the portal's
           success card uses, and palette_gen.py:221 asserts the pair at 4.5:1
           for all 15 theme-modes — so it stays readable whether the tenant
           theme is light or dark, which a fixed `text-white` cannot. */
        [class*="bg-indigo-800"], [class*="bg-indigo-900"] { background-color:var(--ink) !important; }
        /* Inside the inverted chrome the surface IS --ink, so every derived
           text colour below has to be pulled toward --bg instead. Declaring it
           as an inherited custom property means a semantic colour dropped into
           the sidebar later cannot silently darken itself into the surface. */
        [class*="bg-indigo-8"], [class*="bg-indigo-9"], [class*="bg-gray-7"],
        [class*="bg-gray-8"], [class*="bg-gray-9"], aside { --text-anchor:var(--bg); }
        /* One step toward the page colour, so nested pills read as inset in
           either direction rather than assuming "darker" means "deeper". */
        [class*="bg-indigo-950"] { background-color:color-mix(in srgb, var(--ink) 86%, var(--bg)) !important; }

        [class*="bg-indigo-800"], [class*="bg-indigo-900"], [class*="bg-indigo-950"],
        [class*="bg-indigo-800"] .text-white, [class*="bg-indigo-900"] .text-white, [class*="bg-indigo-950"] .text-white,
        [class*="from-indigo-9"] .text-white, [class*="from-indigo-9"] h1, [class*="from-indigo-9"] h2 { color:var(--bg) !important; }

        /* Muted sidebar copy: legible against --ink without competing with the
           primary labels. */
        [class*="text-indigo-100"], [class*="text-indigo-200"], [class*="text-indigo-300"] { color:color-mix(in srgb, var(--bg) 74%, var(--ink)) !important; }
        [class*="border-indigo-800"], [class*="border-indigo-900"] { border-color:color-mix(in srgb, var(--bg) 24%, var(--ink)) !important; }

        /* The unauthenticated login backdrop. */
        [class*="from-indigo-9"] { --tw-gradient-from:var(--ink) var(--tw-gradient-from-position) !important; }
        [class*="to-indigo-95"] { --tw-gradient-to:color-mix(in srgb, var(--ink) 86%, var(--bg)) var(--tw-gradient-to-position) !important; }

        /* ══ Tenant theme takes over every Tailwind colour the CMS uses ══
           Audited 2026-07-30: cms-app.jsx carries 1,389 colour utilities across
           12 families. Only indigo and purple were ever re-pointed, so a studio
           that picked the clay palette still saw a green "网站与品牌" button, a
           blue "长期未到访" panel, green row actions and pink birthday chips —
           the CMS looked like four products stacked together.

           The mapping is by ROLE, not by hue, because that is what survives a
           theme switch: red/rose mean danger whatever the palette, gray means
           "structure", and the tenant's own success/warning/danger already
           carry generator-checked contrast (palette_gen.py asserts each against
           both page and panel). Mapping hue-to-hue would just move the problem.

           Soft fills go through color-mix against --panel rather than a fixed
           tint, so they stay light under a light theme and dark under a dark one
           instead of becoming a pale slab on a dark page. */

        /* — structure: gray/slate/zinc/neutral/stone — */
        [class*="bg-gray-50"], [class*="bg-slate-50"], [class*="bg-zinc-50"], [class*="bg-neutral-50"], [class*="bg-stone-50"],
        [class*="bg-gray-100"], [class*="bg-slate-100"], [class*="bg-zinc-100"] { background-color:var(--bg2) !important; }
        /* Was 70% of --line. --muted on the resulting chip measured 4.17:1 at
           worst (studio-ink dark) — the chip is a surface that hosts text, not
           a divider. At 50% it measures 4.56:1 and the chip still reads as a
           distinct layer (1.15 against --panel). */
        [class*="bg-gray-200"], [class*="bg-slate-200"], [class*="bg-gray-300"] { background-color:color-mix(in srgb, var(--line) 50%, var(--panel)) !important; }
        [class*="text-gray-400"], [class*="text-slate-400"], [class*="text-gray-500"], [class*="text-slate-500"],
        [class*="text-zinc-400"], [class*="text-neutral-400"] { color:var(--muted) !important; }
        [class*="text-gray-600"], [class*="text-slate-600"], [class*="text-gray-700"], [class*="text-slate-700"] { color:var(--ink2) !important; }
        [class*="text-gray-800"], [class*="text-slate-800"], [class*="text-gray-900"], [class*="text-slate-900"] { color:var(--ink) !important; }
        [class*="border-gray-"], [class*="border-slate-"], [class*="border-zinc-"], [class*="border-neutral-"], [class*="border-stone-"] { border-color:var(--line) !important; }
        [class*="divide-gray-"], [class*="divide-slate-"] { border-color:var(--line) !important; }

        /* — success: green / emerald / teal / lime — */
        [class*="bg-green-50"], [class*="bg-green-100"], [class*="bg-emerald-50"], [class*="bg-emerald-100"],
        [class*="bg-teal-50"], [class*="bg-teal-100"], [class*="bg-lime-50"], [class*="bg-lime-100"] { background-color:color-mix(in srgb, var(--success) 12%, var(--panel)) !important; }
        [class*="bg-green-6"], [class*="bg-green-7"], [class*="bg-emerald-6"], [class*="bg-emerald-7"],
        [class*="bg-teal-6"], [class*="bg-teal-7"] { background-color:var(--success) !important; color:var(--on-accent) !important; }
        /* palette_gen solves --success/--warning/--danger against the PAGE only
           (palette_gen.py:174; CHECKS 231-233). The CMS also puts that text on
           --panel, on --bg2 and on the role's own soft fill — three surfaces
           nothing ever asserted. Measured across the 15 theme-modes those
           failed 8/15, 15/15 and 11-15/15 respectively, worst 2.86:1 (danger
           on --bg2, arcade-lime dark).
           Pulling the colour toward --text-anchor fixes both modes with one
           ratio: the anchor is dark under a light theme and light under a dark
           one, so the mix always moves away from the surface. 68% is the exact
           AA boundary; 61.8% is the golden section and buys real margin for
           six points of chroma. Measured at 61.8%: worst 5.00:1 (danger /
           --bg2 / arcade-lime dark), best 8.72:1, 0 failures in 180 pairs. */
        [class*="text-green-"], [class*="text-emerald-"], [class*="text-teal-"], [class*="text-lime-"] { color:color-mix(in srgb, var(--success) 61.8%, var(--text-anchor)) !important; }
        [class*="border-green-"], [class*="border-emerald-"], [class*="border-teal-"], [class*="border-lime-"] { border-color:color-mix(in srgb, var(--success) 45%, var(--panel)) !important; }

        /* — warning: amber / yellow / orange — */
        [class*="bg-amber-50"], [class*="bg-amber-100"], [class*="bg-yellow-50"], [class*="bg-yellow-100"],
        [class*="bg-orange-50"], [class*="bg-orange-100"] { background-color:color-mix(in srgb, var(--warning) 14%, var(--panel)) !important; }
        [class*="bg-amber-6"], [class*="bg-amber-7"], [class*="bg-orange-6"], [class*="bg-orange-7"] { background-color:var(--warning) !important; color:var(--on-accent) !important; }
        [class*="text-amber-"], [class*="text-yellow-"], [class*="text-orange-"] { color:color-mix(in srgb, var(--warning) 61.8%, var(--text-anchor)) !important; }
        [class*="border-amber-"], [class*="border-yellow-"], [class*="border-orange-"] { border-color:color-mix(in srgb, var(--warning) 45%, var(--panel)) !important; }

        /* — danger: red / rose — */
        [class*="bg-red-50"], [class*="bg-red-100"], [class*="bg-rose-50"], [class*="bg-rose-100"] { background-color:color-mix(in srgb, var(--danger) 12%, var(--panel)) !important; }
        [class*="bg-red-6"], [class*="bg-red-7"], [class*="bg-rose-6"], [class*="bg-rose-7"] { background-color:var(--danger) !important; color:var(--on-accent) !important; }
        [class*="text-red-"], [class*="text-rose-"] { color:color-mix(in srgb, var(--danger) 61.8%, var(--text-anchor)) !important; }
        [class*="border-red-"], [class*="border-rose-"] { border-color:color-mix(in srgb, var(--danger) 45%, var(--panel)) !important; }

        /* — informational: blue / sky / cyan / pink / fuchsia —
           These carry no semantic weight of their own in this app (the blue
           "long absence" panel, the pink birthday chips), so they follow the
           tenant's secondary accent and stay distinct from the primary. */
        [class*="bg-blue-50"], [class*="bg-blue-100"], [class*="bg-sky-50"], [class*="bg-sky-100"],
        [class*="bg-cyan-50"], [class*="bg-pink-50"], [class*="bg-pink-100"], [class*="bg-fuchsia-50"] { background-color:color-mix(in srgb, var(--accent-dark) 10%, var(--panel)) !important; }
        [class*="bg-blue-6"], [class*="bg-blue-7"], [class*="bg-sky-6"], [class*="bg-pink-6"], [class*="bg-pink-7"] { background-color:var(--accent-dark) !important; color:var(--on-secondary) !important; }
        /* The brand accents get the same treatment as the semantic colours but
           at a far lighter dose: --accent-dark on --bg2 was the single
           remaining miss (4.44:1, arcade-lime dark). Six points toward the
           anchor lifts the worst pair to 4.72:1 and is not perceptible as a
           change of hue, so the studio's secondary still reads as its own. */
        [class*="text-blue-"], [class*="text-sky-"], [class*="text-cyan-"], [class*="text-pink-"], [class*="text-fuchsia-"] { color:color-mix(in srgb, var(--accent-dark) 94%, var(--text-anchor)) !important; }
        [class*="border-blue-"], [class*="border-sky-"], [class*="border-cyan-"], [class*="border-pink-"], [class*="border-fuchsia-"] { border-color:color-mix(in srgb, var(--accent-dark) 45%, var(--panel)) !important; }

        /* The tail of the audit: shades used only once or twice, which is exactly
           how a palette leaks back in — nobody notices a single bg-amber-400. */
        /* bg-gray-700/800/900 are restated in the readability pass below, after
           the neutral chip rule, so a `disabled:bg-gray-300` on the same
           element can no longer outrank them. */
        /* There is no legible tier below --muted. The 70% mix that used to sit
           here measured 3.03:1 on --panel in every one of the 15 theme-modes,
           because --muted is already solved to sit exactly on the AA floor —
           anything fainter is by construction below it. The faintest tier
           therefore collapses into --muted (worst 5.56:1) and hierarchy at
           that level comes from size and weight instead of from fading. */
        [class*="text-gray-300"] { color:var(--muted) !important; }
        [class*="text-indigo-900"] { color:var(--accent) !important; }
        [class*="text-purple-900"] { color:var(--accent-dark) !important; }
        /* bg-amber-400 is a count badge carrying a label, so it is promoted to
           the solid warning + --on-accent pair in the readability pass below;
           bg-amber-200 stays a highlight fill with no text of its own. */
        [class*="bg-amber-200"] { background-color:color-mix(in srgb, var(--warning) 55%, var(--panel)) !important; }
        [class*="bg-green-400"] { background-color:color-mix(in srgb, var(--success) 60%, var(--panel)) !important; }
        [class*="bg-red-900"] { background-color:var(--danger) !important; color:var(--on-accent) !important; }
        [class*="bg-blue-200"] { background-color:color-mix(in srgb, var(--accent-dark) 30%, var(--panel)) !important; }

        /* Decorative gradients (avatar placeholders, celebration banners).
           Both stops follow the theme so a gradient cannot smuggle an
           off-palette hue past the rules above. */
        [class*="from-purple-"], [class*="from-pink-"], [class*="from-rose-"],
        [class*="from-blue-"], [class*="from-emerald-"], [class*="from-amber-"] { --tw-gradient-from:var(--accent) var(--tw-gradient-from-position) !important; }
        [class*="to-pink-"], [class*="to-rose-"], [class*="to-purple-"],
        [class*="to-blue-"], [class*="to-emerald-"], [class*="to-amber-"] { --tw-gradient-to:var(--accent-dark) var(--tw-gradient-to-position) !important; }

        /* ══ Readability pass: what the role map above left unreadable ══
           The block above answers "which token does this colour come from".
           It does not answer "can you still read the text once BOTH ends
           follow the theme", and that is a different question with a
           different failure mode — a value can be perfectly on-brand and
           invisible. Replaying every (text token x background token) pair the
           CMS can produce against the 15 shipped theme-modes in
           backend/studiosaas/presets.py gave 197 failures in 645 pairs. The
           rules below close them; each carries the measured worst case, and
           "worst" always means the worst of all 15 theme-modes.

           Three of the four causes are the same bug in different clothes:
           `[class*="bg-red-50"]` is a substring test, so it also matches
           `bg-red-500` and `active:bg-red-50`. The fourth is a coverage gap —
           bg-white/text-white are not `<family>-<shade>` utilities, so the
           audit regex that produced the map above never saw them. */

        /* The pole that derived text colours are pulled toward. Every content
           surface in the CMS sits near --bg, so mixing toward --ink always
           increases contrast, in either mode. The inverted chrome overrides
           it to --bg where the surface itself is --ink (see above). */
        :root { --text-anchor:var(--ink); }

        /* ── 1. bg-white / text-white were never re-pointed ──
           99 uses of bg-white are the card, modal and sheet surface of this
           app. Under the eight dark theme-modes the card stayed #ffffff while
           its text became --ink, i.e. near-white on white. Measured worst
           (arcade-lime dark): body 1.02:1, soft 1.40:1, muted 2.44:1. On
           var(--panel) the same three pairs measure 13.25 / 9.67 / 5.56.
           `bg-white/NN` is excluded: those sit on a bg-black scrim over a
           photograph, where white genuinely is the right foreground. */
        [class*="bg-white"]:not([class*="bg-white/"]) { background-color:var(--panel) !important; }
        [class*="bg-black"]:not([class*="bg-black/"]) { background-color:var(--ink) !important; color:var(--bg) !important; }

        /* ── 2. the -500 shades were being caught by the -50 soft fills ──
           `bg-red-50` is a prefix of `bg-red-500`, so the solid refund button,
           the low-balance badge and the portfolio delete button all rendered
           as a 12% tint under a white label. Restating the 500s after the soft
           fills makes the longer, more specific token win on source order, and
           pairs each with the on-colour the generator asserts (worst 4.56:1
           for the semantic fills, 5.83:1 for the accent). */
        [class*="bg-red-500"], [class*="bg-rose-500"] { background-color:var(--danger) !important; color:var(--on-accent) !important; }
        [class*="bg-amber-500"], [class*="bg-amber-400"], [class*="bg-orange-500"], [class*="bg-yellow-500"] { background-color:var(--warning) !important; color:var(--on-accent) !important; }
        [class*="bg-emerald-500"], [class*="bg-green-500"], [class*="bg-teal-500"] { background-color:var(--success) !important; color:var(--on-accent) !important; }
        [class*="bg-indigo-500"], [class*="bg-blue-500"], [class*="bg-sky-500"] { background-color:var(--accent) !important; color:var(--on-accent) !important; }
        [class*="bg-purple-500"], [class*="bg-pink-500"], [class*="bg-fuchsia-500"] { background-color:var(--accent-dark) !important; color:var(--on-secondary) !important; }

        /* ── 3. a `disabled:` / `active:` prefix is invisible to [class*=] ──
           `disabled:bg-gray-300` sits on seven of the CMS's primary buttons
           (create class, join today's roster, save, top up). The map read it
           as `bg-gray-300` and painted them the disabled chip AT REST, under
           a text-white label: measured 1.25:1. Restating the solid fills here,
           after the neutral rule, gives the button its colour back. */
        [class*="bg-indigo-600"], [class*="bg-indigo-700"], .tab-active { background-color:var(--tenant-primary) !important; }
        [class*="bg-gray-700"], [class*="bg-gray-800"], [class*="bg-gray-900"] { background-color:var(--ink) !important; color:var(--bg) !important; }
        /* …and the disabled state moves onto the real pseudo-class, with the
           token pair palette_gen solves for it (3.00:1 at worst — legible,
           and deliberately under AA so it still READS as unavailable, which
           is also why it no longer needs the blanket opacity). */
        [class*="disabled:bg-gray-2"]:disabled, [class*="disabled:bg-gray-3"]:disabled,
        [class*="disabled:bg-slate-2"]:disabled, [class*="disabled:bg-slate-3"]:disabled {
            background-color:var(--disabled-surface) !important;
            color:var(--disabled-text) !important;
            opacity:1 !important;
        }
        /* An element whose ONLY colour class is a VARIANT has no resting fill
           at all — the mobile bottom nav, the sidebar rows, the selected-tab
           underline. They were painting the variant's colour permanently:
           `active:bg-indigo-800` resolved to var(--ink) under every theme, and
           an `after:bg-indigo-600` underline filled its own button with the
           accent under accent-coloured text (1.00:1).
           Keyed on the ":" that only a variant prefix can contain, and it
           stands down for the states that are supposed to paint, so the fill
           returns on :hover / :active / :disabled and nowhere else. */
        [class*=":bg-"]:not([class^="bg-"]):not([class*=" bg-"]):not(:hover):not(:active):not(:disabled) { background-color:transparent !important; }
        /* Pressed feedback for the two families that carry it, restored on the
           state that was supposed to trigger it. */
        [class*="active:bg-gray-"]:active, [class*="active:bg-slate-"]:active { background-color:var(--bg2) !important; }
        [class*="active:bg-indigo-1"]:active, [class*="active:bg-indigo-5"]:active { background-color:color-mix(in srgb, var(--accent) 18%, var(--panel)) !important; }
        [class*="active:bg-indigo-8"]:active, [class*="active:bg-indigo-7"]:active { background-color:color-mix(in srgb, var(--ink) 78%, var(--bg)) !important; }

        /* ── 4. the two dark systems are now one token pipeline ──
           OS preference only supplies the pre-brand fallback. Once /brand has
           answered, data-brand-scheme and the tenant role map own the page,
           row hover and placeholder together. This keeps a light tenant theme
           light even when the device prefers dark, and removes the former
           utility-by-utility dark table. */
        html[data-brand-scheme], html[data-brand-scheme] body { background:var(--bg) !important; }
        html[data-brand-scheme] .hover-row:hover { background:color-mix(in srgb, var(--line) 38.2%, var(--panel)) !important; }
        html[data-brand-scheme] input::placeholder,
        html[data-brand-scheme] textarea::placeholder { color:var(--muted) !important; }
        html[data-brand-scheme] [class*="bg-white/70"] { background-color:color-mix(in srgb, var(--panel) 70%, transparent) !important; }

        /* ── 5. focus rings ──
           The role map above claims bg/text/border/from/to but never ring-*,
           which Tailwind implements through its own --tw-ring-color. That was
           the last hue the tenant palette did not own: all 65 focus rings in
           the CMS drew Tailwind indigo, so a clay or forest studio got an
           indigo halo on every input it focused, and on a dark theme an indigo
           ring against a dark panel can fall under the 3:1 that WCAG 1.4.11
           asks of a focus indicator. The palette has shipped focus_ring_color
           (mapped to --focus-ring) all along; this connects it.

           Listed by family rather than by the six utilities in use today, so a
           ring added later is themed on arrival instead of reopening the gap.
           --accent is the fallback because a tenant that predates
           focus_ring_color still has an accent. */
        [class*="ring-indigo-"], [class*="ring-purple-"], [class*="ring-violet-"], [class*="ring-fuchsia-"],
        [class*="ring-blue-"],   [class*="ring-sky-"],    [class*="ring-cyan-"],
        [class*="ring-emerald-"],[class*="ring-green-"],  [class*="ring-teal-"],  [class*="ring-lime-"],
        [class*="ring-gray-"],   [class*="ring-slate-"],  [class*="ring-zinc-"],
        [class*="ring-pink-"] {
            --tw-ring-color: var(--focus-ring, var(--accent)) !important;
        }
        /* Danger and warning keep their own ring: these sit on the delete,
           refund and credit-adjustment inputs, where the ring is part of the
           warning rather than a neutral focus cue. */
        [class*="ring-red-"], [class*="ring-rose-"] {
            --tw-ring-color: var(--danger) !important;
        }
        [class*="ring-amber-"], [class*="ring-yellow-"], [class*="ring-orange-"] {
            --tw-ring-color: var(--warning) !important;
        }

        /* The shared admin language switch reads --brand, which the CMS never
           defined, so it fell back to the stock blue #3b82f6 in the corner of
           an otherwise themed page. */
        :root { --brand:var(--accent); }

        /* ── M6: Thumbnail active feedback on touch ── */
        .port-thumb { touch-action:manipulation; }
        .port-thumb:active { opacity:.82; transform:scale(.96); transition:opacity .08s,transform .08s; }
        /* ── M7: Image loading skeleton ── */
        .img-skel { background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%); background-size:200% 100%; animation:skel-shine 1.4s infinite; }
        @keyframes skel-shine { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ── A11y: respect prefers-reduced-motion (2026-07 UI audit) ──
           Entry/exit and shimmer animations are decorative; users who ask the
           OS for less motion get instant state changes instead. The .sp
           loading spinner is kept (it conveys "busy"), everything else stops. */
        @media (prefers-reduced-motion: reduce) {
            .anim, .toast, .img-skel { animation: none !important; }
            *, *::before, *::after { transition-duration: .01ms !important; }
            html { scroll-behavior: auto !important; }
            button:hover, a:hover, [role="button"]:hover { transform: none !important; }
            .port-thumb:active { transform: none !important; }
        }

        /* ── Print styles (export feature) ── */
        @media print {
            aside, .no-print { display:none !important; }
            main { padding:0 !important; overflow:visible !important; }
            body { background:white !important; }
            .print-card { break-inside:avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
<div id="root"></div>
<script src="/assets/cms-app.js?v=__APP_VERSION__"></script>
<!-- Loaded after the app so the observer starts on a rendered tree. Shares the
     language choice with Studio Admin / Super Admin via admin-i18n's key. -->
<script src="/assets/cms-i18n.js?v=__APP_VERSION__"></script>
</body>
</html>
