  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font-family:var(--font-body);line-height:1.7;-webkit-font-smoothing:antialiased}
    a{color:var(--clay);text-decoration:none;font-weight:500}
    .skip-link{position:absolute;left:12px;top:-60px;z-index:100;padding:10px 14px;border-radius:var(--radius);background:var(--ink);color:var(--bg)}
    .skip-link:focus{top:12px}
    nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .navrow{display:flex;align-items:center;justify-content:space-between;gap:16px;height:74px;width:min(1180px,100%);margin:0 auto;padding:0 var(--space-phi-md)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;min-height:var(--tap-min);color:var(--ink)}
    .brand img{display:none;height:34px;width:auto}
    .brand .bn{font-size:16px;letter-spacing:.04em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .navlinks{display:flex;align-items:center;gap:26px}
    .navlinks a{position:relative;padding:4px 0;color:var(--ink2);font-size:13px;letter-spacing:.02em}
    .navlinks a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--clay);transition:width .25s}
    .navlinks a:hover::after,.navlinks a[aria-current="page"]::after{width:100%}
    .navlinks a[aria-current="page"]{color:var(--ink)}
    .navcta{display:inline-flex;align-items:center;min-height:var(--tap-min);padding:10px 20px;border:1px solid var(--ink);border-radius:var(--radius-pill)}
    .navcta:hover{background:var(--ink);color:var(--bg)}
    .navcta::after{display:none!important}
    .langtog{display:inline-flex;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-pill)}
    .langtog button{min-width:var(--tap-min);min-height:var(--tap-min);padding:8px 12px;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
    .langtog button.on{background:var(--ink);color:var(--bg)}
    .menu-btn{display:none;width:var(--tap-min);height:var(--tap-min);align-items:center;justify-content:center;padding:0;border:0;background:none;color:var(--ink);cursor:pointer}
    .menu-btn svg{width:22px;height:22px}
    main{width:min(1180px,100%);margin:0 auto;padding:var(--space-phi-2xl) var(--space-phi-md) var(--space-phi-xl)}
    .intro{max-width:760px;margin-bottom:var(--space-phi-xl)}
    .eyebrow{color:var(--muted);font-size:11px;letter-spacing:.04em;font-weight:500}
    html[lang="en"] .eyebrow{letter-spacing:.28em;text-transform:uppercase;font-weight:400}
    h1{margin:var(--space-phi-sm) 0;font-family:var(--font-display);font-size:clamp(30px,6vw,58px);font-weight:500;line-height:1.06;letter-spacing:.01em;text-wrap:balance}
    .lead{max-width:var(--brand-reading-measure);margin:0;color:var(--ink2);font-size:16px;text-wrap:pretty}
    .count{margin-top:12px;color:var(--muted);font-size:13px}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--space-phi-lg)}
    .filter{min-height:var(--tap-min);padding:8px 16px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);background:transparent;color:var(--ink2);font:inherit;font-size:13px;cursor:pointer}

    .sc-item:first-child{grid-row:span 2}
    .sc-frame{position:relative;overflow:hidden;aspect-ratio:1;border-radius:var(--radius-card);background:var(--panel);border:1px solid var(--line)}

    .sc-frame img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
    .sc-item:hover .sc-frame img{transform:scale(1.025)}
    .sc-open,.sc-play{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer}

    .foot{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:24px;width:min(1180px,100%);margin:0 auto;padding:0 var(--space-phi-md)}

    .lb-close,.lb-nav{min-width:var(--tap-min);min-height:var(--tap-min);padding:8px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
    .lb-stage{display:grid;place-items:center;min-height:min(68vh,680px);padding:18px;background:var(--bg)}
    .lb-stage img,.lb-stage iframe{display:block;width:min(100%,980px);max-height:68vh;aspect-ratio:auto;border:0;object-fit:contain}
    .lb-counter{color:var(--muted);font-size:13px}
    @media(max-width:900px){.navlinks{display:none}.menu-btn{display:flex}.showcase-grid{grid-template-columns:1fr 1fr}.sc-item:first-child{grid-row:auto;grid-column:1/-1}.sc-item:first-child .sc-frame{aspect-ratio:16/10}}

    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.sc-item:hover .sc-frame img{transform:none}}
  </style>
</head>

<script>
  'use strict';
  const TENANT_SLUG = 'lets-paint-showcase';
  const TENANT_NAME = "Let's Paint Studio";
  const API = `/v1/public/${encodeURIComponent(TENANT_SLUG)}`;
  const esc = window.StudioSaaS.esc;
  const params = new URLSearchParams(location.search);
  const normaliseLang = (value) => String(value || '').toLowerCase().startsWith('en') ? 'en' : String(value || '').toLowerCase().startsWith('zh') ? 'zh' : '';
  let language = normaliseLang(params.get('lang')) || (() => { try { return normaliseLang(localStorage.getItem(`pwe_lang_${TENANT_SLUG}`)); } catch (_) { return ''; } })() || normaliseLang(navigator.language) || 'zh';
  const state = { brand: {}, category: String(params.get('category') || '').trim().slice(0,24), items: [], total: 0, offset: 0, hasMore: false, loading: false, requestId: 0, lightboxIndex: -1, authoritativeSurface: null, surfaceSettled: false };
  let abortController = null;
  const T = (zh, en) => language === 'en' ? en : zh;
  const localized = (value, fallback = '') => {
    if (value && typeof value === 'object') return value[language] || value.en || value.zh || fallback;
    return String(value == null ? '' : value).trim() || fallback;
  };
  const websiteOf = () => state.brand.websiteProfile || state.brand.website_profile || {};
  const setStatus = (text) => { document.getElementById('status').textContent = text || ''; };
  function refreshPublicSurfaceContract() {
    if (!window.StudioSaaS.publicSurface) return;
    if (state.authoritativeSurface) {
      state.publicSurface = state.authoritativeSurface;
      window.StudioSaaS.publicSurface.apply(state.publicSurface, document);
      return;
    }
    if (!state.surfaceSettled) return;
    state.publicSurface = window.StudioSaaS.publicSurface.resolve({
      slug: TENANT_SLUG, brand: state.brand,
      showcase: state.data || { enabled: true, items: state.items, total: state.total }
    });
    window.StudioSaaS.publicSurface.apply(state.publicSurface, document);
  }
  window.StudioSaaS.publicSurface.fetch(API).then((contract) => {
    state.authoritativeSurface = contract;
    state.surfaceSettled = true;
    refreshPublicSurfaceContract();
  }).catch((error) => {
    state.surfaceSettled = true;
    refreshPublicSurfaceContract();
    console.warn('Public surface contract unavailable; using locally confirmed content.', error);
  });

  function updateMeta() {
    const path = location.pathname;
    const next = new URLSearchParams();
    if (state.category) next.set('category', state.category);
    if (language === 'en') next.set('lang', 'en');
    const query = next.toString();
    const url = `${location.origin}${path}${query ? `?${query}` : ''}`;
    document.getElementById('canonicalUrl').href = url;
    document.getElementById('altLangZh').href = `${location.origin}${path}${state.category ? `?category=${encodeURIComponent(state.category)}` : ''}`;
    document.getElementById('altLangEn').href = `${location.origin}${path}?${state.category ? `category=${encodeURIComponent(state.category)}&` : ''}lang=en`;
    document.getElementById('altLangDefault').href = document.getElementById('altLangZh').href;
    document.getElementById('ogUrl').content = url;
    const leadImage = state.items[0] && (state.items[0].image_url || state.items[0].imageUrl);
    try { document.getElementById('ogImage').content = leadImage ? new URL(leadImage, location.origin).href : ''; } catch (_) { document.getElementById('ogImage').content = ''; }
    document.getElementById('ogLocale').content = language === 'en' ? 'en_US' : 'zh_CN';
    document.getElementById('ogLocaleAlternate').content = language === 'en' ? 'zh_CN' : 'en_US';
    try { history.replaceState(null, '', `${path}${query ? `?${query}` : ''}`); } catch (_) {}
  }

  function applyLanguage() {
    document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-zh][data-en]').forEach((node) => { node.textContent = node.dataset[language]; });
    document.querySelectorAll('[data-language]').forEach((button) => { const active = button.dataset.language === language; button.classList.toggle('on', active); button.setAttribute('aria-pressed', active ? 'true' : 'false'); });
    document.querySelector('.menu-btn').setAttribute('aria-label', T('打开导航菜单', 'Open navigation menu'));
    document.getElementById('filters').setAttribute('aria-label', T('作品分类', 'Work categories'));
    document.getElementById('loadMore').textContent = T('加载更多', 'Load more');
    const website = websiteOf();
    const label = localized(website.showcase_label || website.showcaseLabel, T('工作室作品', 'Selected Work'));
    const title = localized(website.showcase_title || website.showcaseTitle, T('出自这间工作室', 'Work from this studio'));
    const lead = localized(website.showcase_lead || website.showcaseLead, '');
    document.getElementById('pageEyebrow').textContent = label;
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageLead').textContent = lead;
    document.getElementById('pageCount').textContent = state.total ? T(`${state.total} 件公开作品`, `${state.total} published works`) : '';
    updateMeta();
    renderFilters();
    renderGrid();
    try { localStorage.setItem(`pwe_lang_${TENANT_SLUG}`, language); } catch (_) {}
  }

  function setMobileNav(open) {
    const menu = document.getElementById('mnav');
    const button = document.querySelector('.menu-btn');
    menu.style.display = open ? 'flex' : 'none';
    button.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  document.querySelector('.menu-btn').addEventListener('click', () => setMobileNav(document.getElementById('mnav').style.display === 'none'));
  document.getElementById('mnav').addEventListener('click', (event) => { if (event.target.closest('a')) setMobileNav(false); });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && document.getElementById('mnav').style.display !== 'none') { setMobileNav(false); document.querySelector('.menu-btn').focus(); } });
  document.querySelectorAll('[data-language]').forEach((button) => button.addEventListener('click', () => { language = button.dataset.language === 'en' ? 'en' : 'zh'; applyLanguage(); }));

  function renderFilters() {
    const host = document.getElementById('filters');
    host.textContent = '';
    const categories = (state.data && state.data.categories) || [];
    if (categories.length < 2) { host.hidden = true; return; }
    host.hidden = false;
    [{ id: '', label: { zh: '全部', en: 'All' } }].concat(categories).forEach((category) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'filter';
      button.textContent = localized(category.label, category.id);
      button.setAttribute('aria-pressed', state.category === category.id ? 'true' : 'false');
      button.addEventListener('click', () => loadCategory(category.id));
      host.appendChild(button);
    });
  }

  function tile(item, index) {
    const figure = document.createElement('figure');
    figure.className = 'sc-item';
    const frame = document.createElement('div');
    frame.className = 'sc-frame';
    const image = String(item.image_url || item.imageUrl || '');
    const video = String(item.video_embed_url || item.videoEmbedUrl || '');
    if (image) {
      const img = document.createElement('img');
      img.src = image; img.alt = localized(item.title, T('工作室作品', 'Studio work')); img.loading = index === 0 ? 'eager' : 'lazy'; img.decoding = 'async';
      img.onerror = () => img.remove();
      frame.appendChild(img);
    }
    if (image || video) {
      const open = document.createElement('button');
      open.type = 'button'; open.className = video ? 'sc-play' : 'sc-open';
      open.setAttribute('aria-label', `${T('查看', 'View')}${localized(item.title) ? `${T('：', ': ')}${localized(item.title)}` : ''}`);
      if (video) open.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.4 4.8v14.4a.9.9 0 001.38.76l11.2-7.2a.9.9 0 000-1.52L9.78 4.04A.9.9 0 008.4 4.8z"/></svg>';
      open.addEventListener('click', () => openLightbox(state.items.indexOf(item)));
      frame.appendChild(open);
    }
    figure.appendChild(frame);
    const title = localized(item.title); const caption = localized(item.caption);
    if (title || caption) { const cap = document.createElement('figcaption'); cap.className = 'sc-cap'; if (title) { const h = document.createElement('h2'); h.textContent = title; cap.appendChild(h); } if (caption) { const p = document.createElement('p'); p.textContent = caption; cap.appendChild(p); } figure.appendChild(cap); }
    return figure;
  }

  function renderGrid() {
    const grid = document.getElementById('showcaseGrid');
    grid.textContent = '';
    state.items.forEach((item, index) => grid.appendChild(tile(item, index)));
    document.getElementById('pageCount').textContent = state.total ? T(`${state.total} 件公开作品`, `${state.total} published works`) : '';
    document.getElementById('loadMore').hidden = !state.hasMore || state.loading;
    const empty = !state.loading && (!state.data || !state.data.enabled || !state.total);
    document.getElementById('emptyState').hidden = !empty;
    if (empty) { grid.hidden = true; document.getElementById('filters').hidden = true; }
    else { grid.hidden = false; }
  }

  async function fetchPage(category, offset, replace) {
    if (state.loading) return;
    state.loading = true;
    const requestId = ++state.requestId;
    abortController?.abort();
    abortController = new AbortController();
    setStatus(offset ? T('正在加载更多作品…', 'Loading more work…') : T('正在加载作品…', 'Loading selected work…'));
    renderGrid();
    const query = new URLSearchParams();
    query.set('offset', String(offset || 0));
    if (category) query.set('category', category);
    try {
      const response = await fetch(`${API}/showcase?${query}`, { signal: abortController.signal, cache: 'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || T('作品暂时无法加载。', 'The showcase could not be loaded.'));
      if (requestId !== state.requestId) return;
      state.data = data;
      state.category = data.category || '';
      state.total = Number(data.total || 0);
      state.offset = Number(data.nextOffset ?? (offset + (data.items || []).length));
      state.hasMore = Boolean(data.hasMore);
      state.items = replace ? (data.items || []) : state.items.concat(data.items || []);
      refreshPublicSurfaceContract();
      setStatus(state.hasMore ? T('继续下滑可加载更多作品。', 'Scroll to load more work.') : T('已显示全部符合条件的作品。', 'All matching work is shown.'));
      applyLanguage();
    } catch (error) {
      if (error.name !== 'AbortError') { setStatus(error.message || T('作品暂时无法加载，请重试。', 'The showcase is unavailable. Please retry.')); renderGrid(); }
    } finally {
      if (requestId === state.requestId) { state.loading = false; renderGrid(); }
    }
  }
  function loadCategory(category) { state.category = String(category || '').trim(); state.items = []; state.total = 0; state.offset = 0; state.hasMore = false; fetchPage(state.category, 0, true); }
  function loadNext() { if (!state.hasMore || state.loading) return; fetchPage(state.category, state.offset, false); }
  document.getElementById('loadMore').addEventListener('click', loadNext);
  const observer = new IntersectionObserver((entries) => { if (entries.some((entry) => entry.isIntersecting)) loadNext(); }, { rootMargin: '420px 0px' });
  observer.observe(document.getElementById('sentinel'));

  function renderLightbox() {
    const item = state.items[state.lightboxIndex]; if (!item) return;
    const stage = document.getElementById('lbStage'); stage.textContent = '';
    const video = String(item.video_embed_url || item.videoEmbedUrl || '');
    if (video) { const iframe = document.createElement('iframe'); iframe.src = video; iframe.title = localized(item.title, T('工作室作品视频', 'Studio work video')); iframe.allowFullscreen = true; iframe.referrerPolicy = 'strict-origin-when-cross-origin'; stage.appendChild(iframe); }
    else if (item.image_url || item.imageUrl) { const image = document.createElement('img'); image.src = item.image_url || item.imageUrl; image.alt = localized(item.title, T('工作室作品', 'Studio work')); stage.appendChild(image); }
    document.getElementById('lbTitle').textContent = localized(item.title);
    document.getElementById('lbCounter').textContent = `${state.lightboxIndex + 1} / ${state.items.length}${state.hasMore ? ' +' : ''}`;
    document.getElementById('lbPrev').hidden = state.items.length < 2;
    document.getElementById('lbNext').hidden = state.items.length < 2 && !state.hasMore;
  }
  function openLightbox(index) { if (index < 0) return; state.lightboxIndex = index; const dialog = document.getElementById('lightbox'); renderLightbox(); if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', ''); document.body.style.overflow = 'hidden'; }
  function closeLightbox() { const dialog = document.getElementById('lightbox'); if (dialog.open) dialog.close(); else dialog.removeAttribute('open'); document.getElementById('lbStage').textContent = ''; document.body.style.overflow = ''; state.lightboxIndex = -1; }
  async function moveLightbox(step) { const next = state.lightboxIndex + step; if (next >= 0 && next < state.items.length) { state.lightboxIndex = next; renderLightbox(); return; } if (step > 0 && state.hasMore) { await fetchPage(state.category, state.offset, false); if (state.lightboxIndex + 1 < state.items.length) { state.lightboxIndex += 1; renderLightbox(); } } }
  document.getElementById('lbClose').addEventListener('click', closeLightbox); document.getElementById('lbPrev').addEventListener('click', () => moveLightbox(-1)); document.getElementById('lbNext').addEventListener('click', () => moveLightbox(1));
  document.getElementById('lightbox').addEventListener('cancel', (event) => { event.preventDefault(); closeLightbox(); });
  document.getElementById('lightbox').addEventListener('click', (event) => { if (event.target.id === 'lightbox') closeLightbox(); });
  document.addEventListener('keydown', (event) => { const dialog = document.getElementById('lightbox'); if (!dialog.open) return; if (event.key === 'ArrowLeft') moveLightbox(-1); if (event.key === 'ArrowRight') moveLightbox(1); });

  async function loadBrand() {
    const response = await fetch(`${API}/brand`, { cache: 'no-store' });
    const data = await response.json(); state.brand = data.brand || {};
    window.StudioSaaS.applyVisualTheme(state.brand);
    const website = websiteOf();
    const principal = state.brand.principalProfile || state.brand.principal_profile || {};
    const name = state.brand.name || TENANT_NAME;
    document.getElementById('tenantName').textContent = name; document.getElementById('footName').textContent = name; document.getElementById('footName2').textContent = name;
    document.getElementById('footContact').textContent = [state.brand.contact_phone || state.brand.contactPhone, state.brand.contact_email || state.brand.contactEmail, state.brand.address].filter(Boolean).join(' · ');
    const rawLogo = state.brand.logo_url || state.brand.logoUrl || ''; const logo = document.getElementById('tenantLogo'); if (rawLogo && !['/logo.png','/logo-light.png','/favicon.svg'].includes(rawLogo)) { logo.src = rawLogo; logo.style.display = 'block'; }
    const title = localized(website.showcase_title || website.showcaseTitle, T('工作室作品', 'Selected Work'));
    const description = localized(website.showcase_lead || website.showcaseLead, T('工作室精选作品展示', 'Selected work from this studio.'));
    document.getElementById('pageDocumentTitle').textContent = `${name} · ${title}`; document.getElementById('pageDescription').content = description; document.getElementById('ogTitle').content = `${name} · ${title}`; document.getElementById('ogDescription').content = description;
    refreshPublicSurfaceContract();
    applyLanguage();
  }
  fetch('/v1/health', { cache: 'no-store' }).then((r) => r.json()).then((health) => { document.getElementById('producerCredit').hidden = !health.showProducerCredit; }).catch((error) => { setStatus(T('页面状态暂时无法确认。', 'Page status could not be confirmed.')); console.warn('Producer credit health unavailable.', error); });
  loadBrand().catch(() => { setStatus(T('品牌资料暂时无法加载。', 'Brand details are temporarily unavailable.')); });
  fetchPage(state.category, 0, true);
</script>
</body>
