# PWE Studio Edition — single-box compose file (DEPLOYMENT.md §1).
#
# UPSTREAM: deploy/aws/docker-compose.yml is the reference this file was
# deliberately duplicated from (the delivery bundle ships both, and compose
# `extends` across files would couple the Edition to platform-only comments
# and profile wiring). When the AWS file changes its env passthrough, logging
# caps, or volume set, mirror the change here.
#
# Edition differences from the AWS file — exactly five (DEPLOYMENT.md §1):
#   1. `db` is a DEFAULT service (no `local-db` profile): a single studio box
#      runs its own PostgreSQL 16; there is no RDS.
#   2. `STUDIOSAAS_MODE=standalone` (+ the first-boot skip flag) in app env.
#   3. The application uses a dedicated least-privilege PostgreSQL role while
#      migrations use the database owner during entrypoint startup.
#   4. Backups bind-mount to a stable host path so release-directory changes
#      cannot split or hide the dump history.
#   5. Project name is per-customer: install.sh writes
#      COMPOSE_PROJECT_NAME=studio-<slug> into /etc/pwe-studio/<slug>.env so
#      containers and volumes never collide with a platform install on the
#      same host. If you run compose by hand, keep `--env-file` pointed at
#      that .env (or pass `-p studio-<slug>`).
#
#   docker compose -f standalone-edition/docker-compose.edition.yml \
#     --env-file standalone-edition/.env up -d

services:
  app:
    build:
      context: ..
      dockerfile: deploy/aws/Dockerfile
    image: studiosaas-edition:${STUDIOSAAS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8899:8899"   # nginx on the host terminates TLS and proxies here
    environment:
      STUDIOSAAS_ENV: ${STUDIOSAAS_ENV:-production}
      # Edition mode gate: exactly one tenant in active state, platform faces closed.
      STUDIOSAAS_MODE: ${STUDIOSAAS_MODE:-standalone}
      # First boot only (before the tenant exists): install.sh sets this to 1,
      # creates/imports the tenant, then flips it back to 0 and restarts.
      STUDIOSAAS_SKIP_STANDALONE_CHECKS: ${STUDIOSAAS_SKIP_STANDALONE_CHECKS:-0}
      STUDIOSAAS_DATABASE_URL: ${STUDIOSAAS_DATABASE_URL:?set STUDIOSAAS_DATABASE_URL in the Edition env file}
      # Used only by entrypoint for migrations/role grants, then explicitly
      # removed before server.py starts.
      STUDIOSAAS_MIGRATION_DATABASE_URL: ${STUDIOSAAS_MIGRATION_DATABASE_URL:?set STUDIOSAAS_MIGRATION_DATABASE_URL in the Edition env file}
      STUDIOSAAS_DB_RUNTIME_ROLE: ${STUDIOSAAS_DB_RUNTIME_ROLE:-studiosaas_app}
      STUDIOSAAS_DB_RUNTIME_PASSWORD: ${EDITION_APP_DB_PASSWORD:?set EDITION_APP_DB_PASSWORD in the Edition env file}
      STUDIOSAAS_SESSION_SECRET: ${STUDIOSAAS_SESSION_SECRET}
      STUDIOSAAS_API_KEY: ${STUDIOSAAS_API_KEY}
      STUDIOSAAS_PUBLIC_BASE_DOMAIN: ${STUDIOSAAS_PUBLIC_BASE_DOMAIN:-}
      # Edition never seeds a platform super admin (README.md §2).
      STUDIOSAAS_SEED_SUPER_ADMIN: "0"
      # Email delivery (SMTP in production; console = log-only default)
      STUDIOSAAS_EMAIL_BACKEND: ${STUDIOSAAS_EMAIL_BACKEND:-console}
      STUDIOSAAS_SMTP_HOST: ${STUDIOSAAS_SMTP_HOST:-}
      STUDIOSAAS_SMTP_PORT: ${STUDIOSAAS_SMTP_PORT:-587}
      STUDIOSAAS_SMTP_USER: ${STUDIOSAAS_SMTP_USER:-}
      STUDIOSAAS_SMTP_PASSWORD: ${STUDIOSAAS_SMTP_PASSWORD:-}
      STUDIOSAAS_SMTP_FROM: ${STUDIOSAAS_SMTP_FROM:-}
      # DB wait ceilings (ms) and support-gate override — documented tunables
      STUDIOSAAS_DB_CONNECT_TIMEOUT: ${STUDIOSAAS_DB_CONNECT_TIMEOUT:-5}
      STUDIOSAAS_DB_STATEMENT_TIMEOUT_MS: ${STUDIOSAAS_DB_STATEMENT_TIMEOUT_MS:-30000}
      STUDIOSAAS_DB_LOCK_TIMEOUT_MS: ${STUDIOSAAS_DB_LOCK_TIMEOUT_MS:-10000}
      STUDIOSAAS_ENFORCE_SUPPORT_GATE: ${STUDIOSAAS_ENFORCE_SUPPORT_GATE:-1}
      COOKIE_SECURE: "1"
      PORT: "8899"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - studiosaas-data:/data
      - studiosaas-media:/media
      # Tenant archive/permanent-delete snapshots — legal retention (incl.
      # publication-consent evidence). Must survive image replacement.
      - studiosaas-archives:/app/backend/archives
      # Runtime-created tenant portal workspaces — without this volume the
      # portal generated at install time is lost on the next image rebuild.
      # entrypoint.sh repopulates it from the template on every boot.
      - studiosaas-tenants:/app/tenants
      # Daily pg_dump output. This path is outside versioned release folders,
      # so switching /opt/pwe-studio/<slug>/current cannot hide old backups.
      # Media backup is deliberately deferred by the product owner in v7.7.8.
      - ${EDITION_BACKUP_DIR:?set EDITION_BACKUP_DIR in the Edition env file}:/app/backups

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studiosaas
      POSTGRES_USER: studiosaas
      POSTGRES_PASSWORD: ${EDITION_DB_PASSWORD:?set EDITION_DB_PASSWORD in standalone-edition/.env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - studiosaas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiosaas -d studiosaas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  studiosaas-data:
  studiosaas-media:
  studiosaas-archives:
  studiosaas-tenants:
  studiosaas-pgdata:
